<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Seguimiento | La Casa del Alfarero</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandRed: '#C8102E',
                        brandBlue: '#2E4A78',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // ==========================================
        // CONFIGURACIÓN DE FIREBASE
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCpy8H7bwtRPumLGmmDaTdouxrEPu9MPSY",
            authDomain: "seguimiento-jose-c-paz.firebaseapp.com",
            projectId: "seguimiento-jose-c-paz",
            storageBucket: "seguimiento-jose-c-paz.firebasestorage.app",
            messagingSenderId: "217508939664",
            appId: "1:217508939664:web:0bc4ad5fbf8d46267c1515"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        function App() {
            const [usuarios, setUsuarios] = React.useState([]);
            const [personas, setPersonas] = React.useState([]);
            const [solicitudesClave, setSolicitudesClave] = React.useState([]);
            const [cargandoDatos, setCargandoDatos] = React.useState(true);

            // Estado de Sesión en el navegador actual
            const [currentUser, setCurrentUser] = React.useState(() => {
                const saved = localStorage.getItem('alfarero_current_user');
                return saved ? JSON.parse(saved) : null;
            });

            // Formularios de Login y Recuperación
            const [loginUserInput, setLoginUserInput] = React.useState('');
            const [loginPassInput, setLoginPassInput] = React.useState('');
            const [loginError, setLoginError] = React.useState('');
            const [showForgotModal, setShowForgotModal] = React.useState(false);
            const [forgotUserInput, setForgotUserInput] = React.useState('');
            const [forgotSuccessMsg, setForgotSuccessMsg] = React.useState('');

            // Estado para cambio de clave obligatorio
            const [nuevaClaveObligatoria, setNuevaClaveObligatoria] = React.useState('');
            const [confirmarClaveObligatoria, setConfirmarClaveObligatoria] = React.useState('');
            const [errorCambioClave, setErrorCambioClave] = React.useState('');

            // Navegación y Vistas
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [selectedPerson, setSelectedPerson] = React.useState(null);
            const [isEditingPerson, setIsEditingPerson] = React.useState(false);
            const [searchTerm, setSearchTerm] = React.useState('');
            const [filterGrado, setFilterGrado] = React.useState('todos');

            // Modales
            const [showNewPersonModal, setShowNewPersonModal] = React.useState(false);

            // Formularios
            const [newPersonData, setNewPersonData] = React.useState({
                nombre: '',
                genero: 'femenino',
                grado: 3,
                canal: 'Evangelismo',
                telefono: '',
                direccion: '',
                perfil: '',
                peticionesOracion: '',
                notasPastor: ''
            });

            const [newUserData, setNewUserData] = React.useState({
                nombre: '',
                usuario: '',
                clave: '',
                rol: 'colaborador'
            });

            const [editingPasswordUserId, setEditingPasswordUserId] = React.useState(null);
            const [newPasswordValue, setNewPasswordValue] = React.useState('');

            // Sincronización y Migración Automática con Firestore
            React.useEffect(() => {
                const unsubUsuarios = db.collection('usuarios').onSnapshot(snapshot => {
                    const lista = snapshot.docs.map(doc => ({ idDoc: doc.id, ...doc.data() }));
                    if (lista.length === 0) {
                        // Migrar usuarios locales si existen, sino poner por defecto
                        const savedLocalUsers = localStorage.getItem('alfarero_usuarios');
                        if (savedLocalUsers) {
                            try {
                                const localUsers = JSON.parse(savedLocalUsers);
                                localUsers.forEach(u => {
                                    const { idDoc, ...uData } = u;
                                    db.collection('usuarios').add(uData);
                                });
                            } catch (e) { console.error(e); }
                        } else {
                            const iniciales = [
                                { id: 1, usuario: "pastor", clave: "1234", nombre: "Pastor / Administración", rol: "pastor", debeCambiarClave: false },
                                { id: 2, usuario: "tatiana", clave: "1234", nombre: "Tatiana Cariddi", rol: "colaborador", debeCambiarClave: false }
                            ];
                            iniciales.forEach(u => db.collection('usuarios').add(u));
                        }
                    } else {
                        setUsuarios(lista);
                    }
                });

                const unsubPersonas = db.collection('personas').onSnapshot(snapshot => {
                    const lista = snapshot.docs.map(doc => ({ idDoc: doc.id, ...doc.data() }));
                    if (lista.length === 0) {
                        // MIGRACIÓN AUTOMÁTICA DE FICHAS LOCALES A LA NUBE
                        const savedLocalPersonas = localStorage.getItem('alfarero_personas');
                        if (savedLocalPersonas) {
                            try {
                                const localPersonas = JSON.parse(savedLocalPersonas);
                                if (localPersonas && localPersonas.length > 0) {
                                    console.log("Migrando fichas locales a Firebase...");
                                    localPersonas.forEach(p => {
                                        const { idDoc, ...dataToUpload } = p;
                                        db.collection('personas').add(dataToUpload);
                                    });
                                }
                            } catch (e) { console.error("Error al migrar fichas locales:", e); }
                        }
                    } else {
                        setPersonas(lista);
                    }
                });

                const unsubSolicitudes = db.collection('solicitudesClave').onSnapshot(snapshot => {
                    const lista = snapshot.docs.map(doc => ({ idDoc: doc.id, ...doc.data() }));
                    setSolicitudesClave(lista);
                    setCargandoDatos(false);
                });

                return () => {
                    unsubUsuarios();
                    unsubPersonas();
                    unsubSolicitudes();
                };
            }, []);

            React.useEffect(() => {
                if (currentUser) {
                    localStorage.setItem('alfarero_current_user', JSON.stringify(currentUser));
                } else {
                    localStorage.removeItem('alfarero_current_user');
                }
            }, [currentUser]);

            const handleLogin = (e) => {
                e.preventDefault();
                const userFound = usuarios.find(
                    u => u.usuario.toLowerCase() === loginUserInput.trim().toLowerCase() && u.clave === loginPassInput.trim()
                );
                if (userFound) {
                    setCurrentUser(userFound);
                    setLoginError('');
                    setLoginUserInput('');
                    setLoginPassInput('');
                } else {
                    setLoginError('Usuario o contraseña incorrectos.');
                }
            };

            const handleLogout = () => {
                setCurrentUser(null);
                setActiveTab('dashboard');
            };

            const handleRequestPasswordReset = (e) => {
                e.preventDefault();
                if (!forgotUserInput.trim()) return;

                const userExists = usuarios.find(u => u.usuario.toLowerCase() === forgotUserInput.trim().toLowerCase());
                if (!userExists) {
                    setForgotSuccessMsg('Si el usuario existe, se ha enviado la solicitud al administrador.');
                    return;
                }

                const yaExiste = solicitudesClave.some(s => s.usuario.toLowerCase() === forgotUserInput.trim().toLowerCase() && !s.atendida);
                if (!yaExiste) {
                    const nuevaSolicitud = {
                        id: Date.now(),
                        usuario: userExists.usuario,
                        nombre: userExists.nombre,
                        fecha: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString(),
                        atendida: false
                    };
                    db.collection('solicitudesClave').add(nuevaSolicitud);
                }

                setForgotSuccessMsg('¡Solicitud enviada con éxito! El administrador revisará tu pedido.');
                setTimeout(() => {
                    setShowForgotModal(false);
                    setForgotSuccessMsg('');
                    setForgotUserInput('');
                }, 3000);
            };

            const handleSaveMandatoryPassword = async (e) => {
                e.preventDefault();
                if (!nuevaClaveObligatoria || nuevaClaveObligatoria.length < 4) {
                    setErrorCambioClave('La contraseña debe tener al menos 4 caracteres.');
                    return;
                }
                if (nuevaClaveObligatoria !== confirmarClaveObligatoria) {
                    setErrorCambioClave('Las contraseñas no coinciden.');
                    return;
                }

                const userDoc = usuarios.find(u => u.id === currentUser.id);
                if (userDoc && userDoc.idDoc) {
                    await db.collection('usuarios').doc(userDoc.idDoc).update({
                        clave: nuevaClaveObligatoria,
                        debeCambiarClave: false
                    });
                }

                const updatedCurrent = { ...currentUser, clave: nuevaClaveObligatoria, debeCambiarClave: false };
                setCurrentUser(updatedCurrent);
                setNuevaClaveObligatoria('');
                setConfirmarClaveObligatoria('');
                setErrorCambioClave('');
                alert('¡Contraseña actualizada correctamente!');
            };

            const handleResolveResetRequest = async (solicitudIdDoc, usuarioLogin, nuevaClaveTemp) => {
                if (!nuevaClaveTemp) {
                    alert('Por favor ingrese una contraseña temporal.');
                    return;
                }

                const targetUser = usuarios.find(u => u.usuario.toLowerCase() === usuarioLogin.toLowerCase());
                if (targetUser && targetUser.idDoc) {
                    await db.collection('usuarios').doc(targetUser.idDoc).update({
                        clave: nuevaClaveTemp,
                        debeCambiarClave: true
                    });
                }

                await db.collection('solicitudesClave').doc(solicitudIdDoc).update({ atendida: true });
                alert(`Contraseña restablecida para ${usuarioLogin}. Deberá cambiarla al iniciar sesión.`);
            };

            const handleCreatePerson = async (e) => {
                e.preventDefault();
                if (!newPersonData.nombre.trim()) return;

                const newEntry = {
                    id: Date.now(),
                    nombre: newPersonData.nombre,
                    genero: newPersonData.genero,
                    grado: parseInt(newPersonData.grado),
                    gradoTexto: `Grado ${newPersonData.grado}: ${gradosMap[newPersonData.grado]}`,
                    canal: newPersonData.canal,
                    visitas: 0,
                    colaborador: currentUser.nombre,
                    telefono: newPersonData.telefono || '',
                    direccion: newPersonData.direccion || '',
                    perfil: newPersonData.perfil || 'Sin datos de perfil.',
                    pedidosOracion: newPersonData.peticionesOracion 
                        ? [{ categoria: "General", texto: newPersonData.peticionesOracion }] 
                        : [],
                    notasPastor: newPersonData.notasPastor || '',
                    comentariosPastor: 'Pendiente de revisión pastoral.',
                    historial: []
                };

                await db.collection('personas').add(newEntry);
                setShowNewPersonModal(false);
                setNewPersonData({ nombre: '', genero: 'femenino', grado: 3, canal: 'Evangelismo', telefono: '', direccion: '', perfil: '', peticionesOracion: '', notasPastor: '' });
            };

            const handleSaveEditedPerson = async (e) => {
                e.preventDefault();
                if (selectedPerson && selectedPerson.idDoc) {
                    const dataToUpdate = {
                        ...selectedPerson,
                        gradoTexto: `Grado ${selectedPerson.grado}: ${gradosMap[selectedPerson.grado]}`
                    };
                    delete dataToUpdate.idDoc;
                    await db.collection('personas').doc(selectedPerson.idDoc).update(dataToUpdate);
                }
                setIsEditingPerson(false);
                alert('¡Ficha actualizada con éxito!');
            };

            const handleCreateUser = async (e) => {
                e.preventDefault();
                if (!newUserData.usuario || !newUserData.clave || !newUserData.nombre) return;

                const newUser = {
                    id: Date.now(),
                    nombre: newUserData.nombre,
                    usuario: newUserData.usuario.toLowerCase().trim(),
                    clave: newUserData.clave,
                    rol: newUserData.rol,
                    debeCambiarClave: true
                };

                await db.collection('usuarios').add(newUser);
                setNewUserData({ nombre: '', usuario: '', clave: '', rol: 'colaborador' });
                alert('¡Usuario creado con éxito y disponible en la nube! Deberá cambiar su clave al primer ingreso.');
            };

            const handleChangePasswordAdmin = async (userId, userDocId) => {
                if (!newPasswordValue.trim()) return;
                if (userDocId) {
                    await db.collection('usuarios').doc(userDocId).update({
                        clave: newPasswordValue.trim(),
                        debeCambiarClave: true
                    });
                }
                setEditingPasswordUserId(null);
                setNewPasswordValue('');
                alert('¡Contraseña restablecida! El usuario deberá cambiarla en su próximo inicio de sesión.');
            };

            const handleDeleteUser = async (userId, userDocId, rolUsuario) => {
                if (rolUsuario === 'pastor' && usuarios.filter(u => u.rol === 'pastor').length <= 1) {
                    alert('No puedes eliminar al único administrador del sistema.');
                    return;
                }
                if (confirm('¿Estás seguro de eliminar este usuario?')) {
                    if (userDocId) {
                        await db.collection('usuarios').doc(userDocId).delete();
                    }
                }
            };

            const gradosMap = {
                1: "Evangelizada", 2: "Contactada", 3: "Interesada", 4: "Dispuesta",
                5: "Invitada", 6: "Congregante", 7: "Miembro", 8: "Servidor"
            };

            const filteredPersonas = personas.filter(p => {
                const matchName = p.nombre.toLowerCase().includes(searchTerm.toLowerCase()) || p.perfil.toLowerCase().includes(searchTerm.toLowerCase()) || (p.direccion && p.direccion.toLowerCase().includes(searchTerm.toLowerCase()));
                const matchGrado = filterGrado === 'todos' || p.grado.toString() === filterGrado;
                return matchName && matchGrado;
            });

            // Versículos de ánimo rotativos diarios
            const versiculosDeAnimo = [
                { texto: "Jehová está cerca de los quebrantados de corazón; y salva a los contritos de espíritu.", cita: "Salmos 34:18" },
                { texto: "Echa sobre Jehová tu carga, y él te sustentará; no dejará para siempre caído al justo.", cita: "Salmos 55:22" },
                { texto: "No temas, porque yo estoy contigo; no desmayes, porque yo soy tu Dios que te fortalezco; siempre te ayudaré, siempre te sustentaré con la diestra de mi justicia.", cita: "Isaías 41:10" },
                { texto: "La paz os dejo, mi paz os doy; yo os la doy como el mundo la da. No se turbe vuestro corazón, ni tenga miedo.", cita: "Juan 14:27" },
                { texto: "Venid a mí todos los que estáis trabajados y cargados, y yo os haré descansar.", cita: "Mateo 11:28" },
                { texto: "Por nada estéis afanosos, sino ostentar vuestras peticiones delante de Dios en toda oración y ruego, con acción de gracias.", cita: "Filipenses 4:6" },
                { texto: "Jehová es mi fortaleza y mi escudo; en él confió mi corazón, y fui ayudado.", cita: "Salmos 28:7" }
            ];

            const diaDelAnio = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));
            const versiculoHoy = versiculosDeAnimo[diaDelAnio % versiculosDeAnimo.length];

            if (cargandoDatos) {
                return (
                    <div className="min-h-screen bg-gray-100 flex flex-col justify-center items-center">
                        <div className="text-center space-y-3">
                            <div className="w-10 h-10 border-4 border-brandRed border-t-transparent rounded-full animate-spin mx-auto"></div>
                            <p className="text-xs font-bold text-gray-600 uppercase tracking-wider">Migrando y conectando con la nube...</p>
                        </div>
                    </div>
                );
            }

            // 1. PANTALLA DE LOGIN
            if (!currentUser) {
                return (
                    <div className="min-h-screen bg-gray-100 flex flex-col justify-center items-center p-4">
                        <div className="max-w-md w-full bg-white rounded-2xl shadow-xl border border-gray-200 p-8 space-y-6">
                            <div className="text-center space-y-3">
                                <img src="Logo La Casa del Alfarero.png" alt="Logo" className="h-20 mx-auto object-contain" onError={(e)=>{e.target.style.display='none';}} />
                                <p className="text-xs font-semibold text-brandRed uppercase tracking-wider">Sistema de seguimiento de almas</p>
                            </div>

                            <form onSubmit={handleLogin} className="space-y-4">
                                {loginError && (
                                    <div className="bg-red-50 text-red-700 text-xs p-3 rounded-lg border border-red-200 font-semibold">
                                        {loginError}
                                    </div>
                                )}
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Usuario</label>
                                    <input 
                                        type="text" 
                                        required
                                        placeholder="Ingrese su usuario"
                                        value={loginUserInput}
                                        onChange={(e) => setLoginUserInput(e.target.value)}
                                        className="w-full px-4 py-2.5 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brandRed"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Contraseña</label>
                                    <input 
                                        type="password" 
                                        required
                                        placeholder="••••••••"
                                        value={loginPassInput}
                                        onChange={(e) => setLoginPassInput(e.target.value)}
                                        className="w-full px-4 py-2.5 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brandRed"
                                    />
                                </div>
                                <button type="submit" className="w-full bg-brandRed text-white font-bold py-3 rounded-lg hover:bg-red-700 transition shadow">
                                    Ingresar a la Plataforma
                                </button>

                                <div className="text-center pt-2">
                                    <button 
                                        type="button" 
                                        onClick={() => setShowForgotModal(true)} 
                                        className="text-xs text-brandBlue font-semibold hover:underline"
                                    >
                                        ¿Olvidé mi contraseña?
                                    </button>
                                </div>
                            </form>
                        </div>

                        {showForgotModal && (
                            <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                                <div className="bg-white rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-xl">
                                    <div className="flex justify-between items-center border-b pb-2">
                                        <h3 className="font-bold text-gray-900 text-base">Recuperar Contraseña</h3>
                                        <button onClick={() => setShowForgotModal(false)} className="text-gray-400 font-bold">✕</button>
                                    </div>
                                    <p className="text-xs text-gray-600">Ingresa tu nombre de usuario para notificar al administrador que necesitas un cambio de clave.</p>
                                    
                                    <form onSubmit={handleRequestPasswordReset} className="space-y-3">
                                        {forgotSuccessMsg && (
                                            <div className="bg-emerald-50 text-emerald-800 text-xs p-2 rounded border border-emerald-200 font-semibold">
                                                {forgotSuccessMsg}
                                            </div>
                                        )}
                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 mb-1">Usuario</label>
                                            <input 
                                                type="text" 
                                                required 
                                                value={forgotUserInput} 
                                                onChange={e => setForgotUserInput(e.target.value)} 
                                                className="w-full p-2 border rounded text-sm" 
                                                placeholder="Tu usuario" 
                                            />
                                        </div>
                                        <div className="flex justify-end gap-2 pt-2">
                                            <button type="button" onClick={() => setShowForgotModal(false)} className="px-3 py-1.5 border rounded text-xs">Cancelar</button>
                                            <button type="submit" className="px-3 py-1.5 bg-brandBlue text-white rounded text-xs font-bold hover:bg-blue-900">Enviar Solicitud</button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            // 2. PANTALLA DE CAMBIO DE CLAVE OBLIGATORIO
            if (currentUser.debeCambiarClave) {
                return (
                    <div className="min-h-screen bg-gray-100 flex flex-col justify-center items-center p-4">
                        <div className="max-w-md w-full bg-white rounded-2xl shadow-xl border border-gray-200 p-8 space-y-6">
                            <div className="text-center space-y-2">
                                <h2 className="text-xl font-bold text-gray-900">Cambio de Contraseña Requerido</h2>
                                <p className="text-xs text-gray-600">Es tu primer ingreso o tu clave ha sido restablecida. Por seguridad, debes establecer una nueva contraseña personal.</p>
                            </div>

                            <form onSubmit={handleSaveMandatoryPassword} className="space-y-4">
                                {errorCambioClave && (
                                    <div className="bg-red-50 text-red-700 text-xs p-3 rounded-lg border border-red-200 font-semibold">
                                        {errorCambioClave}
                                    </div>
                                )}
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Nueva Contraseña</label>
                                    <input 
                                        type="password" 
                                        required
                                        placeholder="Mínimo 4 caracteres"
                                        value={nuevaClaveObligatoria}
                                        onChange={(e) => setNuevaClaveObligatoria(e.target.value)}
                                        className="w-full px-4 py-2.5 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brandRed"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Confirmar Nueva Contraseña</label>
                                    <input 
                                        type="password" 
                                        required
                                        placeholder="Repite la contraseña"
                                        value={confirmarClaveObligatoria}
                                        onChange={(e) => setConfirmarClaveObligatoria(e.target.value)}
                                        className="w-full px-4 py-2.5 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brandRed"
                                    />
                                </div>
                                <button type="submit" className="w-full bg-brandRed text-white font-bold py-3 rounded-lg hover:bg-red-700 transition shadow">
                                    Guardar y Continuar
                                </button>
                            </form>
                            <div className="text-center">
                                <button onClick={handleLogout} className="text-xs text-gray-500 hover:text-gray-800 underline">Cerrar Sesión</button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col bg-gray-100 relative pb-20">
                    <header className="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-30">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-3">
                                <img src="Logo La Casa del Alfarero.png" alt="Logo" className="h-10 object-contain" onError={(e)=>{e.target.style.display='none';}} />
                                <div>
                                    <h1 className="text-base font-bold text-gray-900 leading-tight">La Casa del Alfarero</h1>
                                    <p className="text-xs text-gray-500 font-semibold">Seguimiento • {currentUser.nombre}</p>
                                </div>
                            </div>

                            <div className="flex items-center gap-3 flex-wrap justify-center">
                                <nav className="flex bg-gray-100 p-1 rounded-lg text-xs font-semibold">
                                    <button onClick={() => setActiveTab('dashboard')} className={`px-3 py-1.5 rounded-md transition ${activeTab === 'dashboard' ? 'bg-brandRed text-white shadow' : 'text-gray-600'}`}>Dashboard</button>
                                    <button onClick={() => setActiveTab('personas')} className={`px-3 py-1.5 rounded-md transition ${activeTab === 'personas' ? 'bg-brandRed text-white shadow' : 'text-gray-600'}`}>Personas</button>

                                        {(currentUser.rol === 'pastor' || currentUser.nombre === selectedPerson.colaborador) && (
                                            <button onClick={() => setIsEditingPerson(!isEditingPerson)} className="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold px-3 py-1.5 rounded border">
                                                {isEditingPerson ? 'Cancelar Edición' : '✏️ Editar Ficha'}
                                            </button>
                                        )}
                                        <button onClick={() => { setSelectedPerson(null); setIsEditingPerson(false); }} className="font-bold text-lg px-2">✕</button>
                                    </div>
                                </div>

                                {!isEditingPerson ? (
                                    <div className="space-y-4 text-sm">
                                        <div className="bg-emerald-50 p-4 rounded-xl border border-emerald-200 flex flex-col sm:flex-row justify-between items-center gap-3">
                                            <div>
                                                <span className="font-bold text-emerald-900 text-xs uppercase block">Contacto Rápido</span>
                                                <p className="text-gray-700 text-xs">{selectedPerson.telefono ? `Tel: ${selectedPerson.telefono}` : 'Número de teléfono no cargado'}</p>
                                            </div>
                                            <a 
                                                href={`https://api.whatsapp.com/send?phone=${selectedPerson.telefono || ''}&text=${encodeURIComponent(`Hola ${selectedPerson.nombre}! Te escribo de parte de la iglesia La Casa del Alfarero para saludarte y saber cómo estás.`)}`} 
                                                target="_blank" 
                                                rel="noopener noreferrer" 
                                                className={`bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow transition flex items-center gap-2 ${!selectedPerson.telefono ? 'opacity-75' : ''}`}
                                            >
                                                💬 {selectedPerson.genero === 'masculino' ? 'Anímalo ahora con un mensajito' : 'Anímala ahora con un mensajito'}
                                            </a>
                                        </div>

                                        {selectedPerson.direccion && (
                                            <div className="bg-blue-50 p-3 rounded border border-blue-200 flex justify-between items-center">
                                                <div>
                                                    <span className="font-bold text-brandBlue text-xs uppercase block">Dirección</span>
                                                    <p className="text-gray-700 text-xs">{selectedPerson.direccion}</p>
                                                </div>
                                                <a 
                                                    href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(selectedPerson.direccion)}`} 
                                                    target="_blank" 
                                                    rel="noopener noreferrer" 
                                                    className="bg-brandBlue text-white text-xs font-bold px-3 py-2 rounded-lg hover:bg-blue-900 transition flex items-center gap-1 shadow"
                                                >
                                                    🗺️ Cómo llegar
                                                </a>
                                            </div>
                                        )}

                                        <div>
                                            <h4 className="font-bold text-gray-700 mb-1">Perfil</h4>
                                            <p className="text-gray-600 bg-gray-50 p-3 rounded">{selectedPerson.perfil}</p>
                                        </div>

                                        <div>
                                            <h4 className="font-bold text-gray-700 mb-1">Pedidos de Oración</h4>
                                            {selectedPerson.pedidosOracion && selectedPerson.pedidosOracion.map((p, i) => (
                                                <div key={i} className="text-xs bg-amber-50 p-2 rounded border mb-1">
                                                    <strong>{p.categoria}:</strong> {p.texto}
                                                </div>
                                            ))}
                                        </div>

                                        <div className="bg-gray-50 p-3 rounded border">
                                            <h4 className="font-bold text-gray-700 text-xs uppercase mb-1">Notas para el Pastor</h4>
                                            <p className="text-gray-700 text-xs">{selectedPerson.notasPastor || 'Sin notas registradas.'}</p>
                                        </div>

                                        <div className="bg-blue-50 p-3 rounded border border-blue-200">
                                            <h4 className="font-bold text-brandBlue text-xs uppercase mb-1">Comentarios del Pastor</h4>
                                            <p className="text-gray-700 text-xs">{selectedPerson.comentariosPastor || 'Sin comentarios pastorales.'}</p>
                                        </div>
                                    </div>
                                ) : (
                                    <form onSubmit={handleSaveEditedPerson} className="space-y-3 text-sm">
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="block text-xs font-bold text-gray-700 mb-1">Grado Actual</label>
                                                <select 
                                                    value={selectedPerson.grado} 
                                                    onChange={e => setSelectedPerson({...selectedPerson, grado: parseInt(e.target.value)})}
                                                    className="w-full p-2 border rounded text-xs"
                                                >
                                                    {Object.entries(gradosMap).map(([num, name]) => (
                                                        <option key={num} value={num}>Grado {num}: {name}</option>
                                                    ))}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-gray-700 mb-1">Género</label>
                                                <select 
                                                    value={selectedPerson.genero || 'femenino'} 
                                                    onChange={e => setSelectedPerson({...selectedPerson, genero: e.target.value})}
                                                    className="w-full p-2 border rounded text-xs bg-white"
                                                >
                                                    <option value="femenino">Femenino (Anímala)</option>
                                                    <option value="masculino">Masculino (Anímalo)</option>
                                                </select>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="block text-xs font-bold text-gray-700 mb-1">Teléfono / WhatsApp</label>
                                                <input 
                                                    type="text" 
                                                    value={selectedPerson.telefono || ''} 
                                                    onChange={e => setSelectedPerson({...selectedPerson, telefono: e.target.value})}
                                                    className="w-full p-2 border rounded text-xs"
                                                    placeholder="Ej: 54911xxxxxxxx"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-gray-700 mb-1">Colaborador a Cargo</label>
                                                {currentUser.rol === 'pastor' ? (
                                                    <select 
                                                        value={selectedPerson.colaborador || ''} 
                                                        onChange={e => setSelectedPerson({...selectedPerson, colaborador: e.target.value})}
                                                        className="w-full p-2 border rounded text-xs bg-white"
                                                    >
                                                        <option value="">Seleccionar colaborador</option>
                                                        {usuarios.filter(u => u.rol === 'colaborador').map(u => (
                                                            <option key={u.id || u.idDoc} value={u.nombre}>{u.nombre}</option>
                                                        ))}
                                                    </select>
                                                ) : (
                                                    <input type="text" disabled value={selectedPerson.colaborador} className="w-full p-2 border rounded text-xs bg-gray-100 text-gray-500" />
                                                )}
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 mb-1">Dirección</label>
                                            <input 
                                                type="text" 
                                                value={selectedPerson.direccion || ''} 
                                                onChange={e => setSelectedPerson({...selectedPerson, direccion: e.target.value})}
                                                className="w-full p-2 border rounded text-xs"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 mb-1">Perfil / Notas</label>
                                            <textarea 
                                                rows="3" 
                                                value={selectedPerson.perfil} 
                                                onChange={e => setSelectedPerson({...selectedPerson, perfil: e.target.value})}
                                                className="w-full p-2 border rounded text-xs"
                                            ></textarea>
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 mb-1">Pedido de Oración Principal</label>
                                            <input 
                                                type="text" 
                                                value={selectedPerson.pedidosOracion && selectedPerson.pedidosOracion[0] ? selectedPerson.pedidosOracion[0].texto : ''} 
                                                onChange={e => {
                                                    const newP = selectedPerson.pedidosOracion ? [...selectedPerson.pedidosOracion] : [];
                                                    if(newP[0]) newP[0].texto = e.target.value;
                                                    else newP.push({ categoria: "General", texto: e.target.value });
                                                    setSelectedPerson({...selectedPerson, pedidosOracion: newP});
                                                }}
                                                className="w-full p-2 border rounded text-xs"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 mb-1">Notas para el Pastor</label>
                                            <textarea 
                                                rows="2" 
                                                value={selectedPerson.notasPastor || ''} 
                                                onChange={e => setSelectedPerson({...selectedPerson, notasPastor: e.target.value})}
                                                className="w-full p-2 border rounded text-xs"
                                            ></textarea>
                                        </div>

                                        {currentUser.rol === 'pastor' && (
                                            <div className="bg-blue-50 p-3 rounded border border-blue-200">
                                                <label className="block text-xs font-bold text-brandBlue uppercase mb-1">Comentarios del Pastor (Exclusivo Pastor)</label>
                                                <textarea 
                                                    rows="2" 
                                                    value={selectedPerson.comentariosPastor || ''} 
                                                    onChange={e => setSelectedPerson({...selectedPerson, comentariosPastor: e.target.value})}
                                                    className="w-full p-2 border rounded text-xs bg-white"
                                                ></textarea>
                                            </div>
                                        )}

                                        <div className="flex justify-end gap-2 pt-3 border-t">
                                            <button type="button" onClick={() => setIsEditingPerson(false)} className="px-3 py-1.5 border rounded text-xs">Cancelar</button>
                                            <button type="submit" className="px-4 py-1.5 bg-brandRed text-white rounded text-xs font-bold hover:bg-red-700">Guardar Cambios</button>
                                        </div>
                                    </form>
                                )}

                                <div className="flex justify-end pt-2 border-t">
                                    <button onClick={() => { setSelectedPerson(null); setIsEditingPerson(false); }} className="bg-gray-800 text-white px-4 py-2 rounded text-xs font-semibold">Cerrar Ficha</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
