<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Seguimiento | La Casa del Alfarero</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandRed: '#C8102E',
                        brandBlue: '#2E4A78',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased font-sans">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            // Base de datos de Usuarios
            const [usuarios, setUsuarios] = React.useState(() => {
                const saved = localStorage.getItem('alfarero_usuarios');
                if (saved) return JSON.parse(saved);
                return [
                    { id: 1, usuario: "pastor", clave: "1234", nombre: "Pastor / Administración", rol: "pastor" },
                    { id: 2, usuario: "tatiana", clave: "1234", nombre: "Tatiana Cariddi", rol: "colaborador" }
                ];
            });

            // Estado de Sesión
            const [currentUser, setCurrentUser] = React.useState(() => {
                const saved = localStorage.getItem('alfarero_current_user');
                return saved ? JSON.parse(saved) : null;
            });

            // Formulario de Login
            const [loginUserInput, setLoginUserInput] = React.useState('');
            const [loginPassInput, setLoginPassInput] = React.useState('');
            const [loginError, setLoginError] = React.useState('');

            // Navegación y Vistas
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [selectedPerson, setSelectedPerson] = React.useState(null);
            const [isEditingPerson, setIsEditingPerson] = React.useState(false);
            const [searchTerm, setSearchTerm] = React.useState('');
            const [filterGrado, setFilterGrado] = React.useState('todos');

            // Modales
            const [showNewPersonModal, setShowNewPersonModal] = React.useState(false);

            // Formularios
            const [newPersonData, setNewPersonData] = React.useState({
                nombre: '',
                grado: 3,
                canal: 'Evangelismo',
                perfil: '',
                peticionesOracion: '',
                notasPastor: ''
            });

            const [newUserData, setNewUserData] = React.useState({
                nombre: '',
                usuario: '',
                clave: '',
                rol: 'colaborador'
            });

            const [editingPasswordUserId, setEditingPasswordUserId] = React.useState(null);
            const [newPasswordValue, setNewPasswordValue] = React.useState('');

            // Base de datos de Personas
            const [personas, setPersonas] = React.useState(() => {
                const saved = localStorage.getItem('alfarero_personas');
                if (saved) return JSON.parse(saved);
                return [
                    {
                        id: 1,
                        nombre: "Stella",
                        grado: 6,
                        gradoTexto: "Grado 6: Congregante",
                        canal: "Visita",
                        visitas: 1,
                        colaborador: "Tatiana Cariddi",
                        perfil: "Sensible, estudiosa, busca superarse profesionalmente, muy amable, necesita mucha contención y compañía.",
                        pedidosOracion: [
                            { categoria: "Salud", texto: "Presión alta, diabetes." },
                            { categoria: "Estudios", texto: "Enfermería. Aprobar materias difíciles como inglés." }
                        ],
                        notasPastor: "Se siente muy agradecida y acompañada con la iglesia.",
                        comentariosPastor: "No presenta un problema de salud grave.",
                        historial: []
                    },
                    {
                        id: 2,
                        nombre: "Judith",
                        grado: 5,
                        gradoTexto: "Grado 5: Invitada",
                        canal: "Visita",
                        visitas: 0,
                        colaborador: "Tatiana Cariddi",
                        perfil: "Amable, proactiva, atareada. Doble ánimo, indecisa con congregarse.",
                        pedidosOracion: [{ categoria: "Salud", texto: "Tratamiento de diabetes." }],
                        notasPastor: "Le dejé mensajes pero no respondió.",
                        comentariosPastor: "No presenta un problema de salud grave.",
                        historial: []
                    }
                ];
            });

            React.useEffect(() => {
                localStorage.setItem('alfarero_personas', JSON.stringify(personas));
            }, [personas]);

            React.useEffect(() => {
                localStorage.setItem('alfarero_usuarios', JSON.stringify(usuarios));
            }, [usuarios]);

            React.useEffect(() => {
                if (currentUser) {
                    localStorage.setItem('alfarero_current_user', JSON.stringify(currentUser));
                } else {
                    localStorage.removeItem('alfarero_current_user');
                }
            }, [currentUser]);

            const handleLogin = (e) => {
                e.preventDefault();
                const userFound = usuarios.find(
                    u => u.usuario.toLowerCase() === loginUserInput.trim().toLowerCase() && u.clave === loginPassInput.trim()
                );
                if (userFound) {
                    setCurrentUser(userFound);
                    setLoginError('');
                    setLoginUserInput('');
                    setLoginPassInput('');
                } else {
                    setLoginError('Usuario o contraseña incorrectos.');
                }
            };

            const handleLogout = () => {
                setCurrentUser(null);
                setActiveTab('dashboard');
            };

            const handleCreatePerson = (e) => {
                e.preventDefault();
                if (!newPersonData.nombre.trim()) return;

                const newEntry = {
                    id: Date.now(),
                    nombre: newPersonData.nombre,
                    grado: parseInt(newPersonData.grado),
                    gradoTexto: `Grado ${newPersonData.grado}: ${gradosMap[newPersonData.grado]}`,
                    canal: newPersonData.canal,
                    visitas: 0,
                    colaborador: currentUser.nombre, // Se asigna automáticamente al usuario actual
                    perfil: newPersonData.perfil || 'Sin datos de perfil.',
                    pedidosOracion: newPersonData.peticionesOracion 
                        ? [{ categoria: "General", texto: newPersonData.peticionesOracion }] 
                        : [],
                    notasPastor: newPersonData.notasPastor || '',
                    comentariosPastor: 'Pendiente de revisión pastoral.',
                    historial: []
                };

                setPersonas([newEntry, ...personas]);
                setShowNewPersonModal(false);
                setNewPersonData({ nombre: '', grado: 3, canal: 'Evangelismo', perfil: '', peticionesOracion: '', notasPastor: '' });
            };

            const handleSaveEditedPerson = (e) => {
                e.preventDefault();
                const updatedList = personas.map(p => {
                    if (p.id === selectedPerson.id) {
                        return {
                            ...selectedPerson,
                            gradoTexto: `Grado ${selectedPerson.grado}: ${gradosMap[selectedPerson.grado]}`
                        };
                    }
                    return p;
                });
                setPersonas(updatedList);
                setIsEditingPerson(false);
                alert('¡Ficha actualizada con éxito!');
            };

            const handleCreateUser = (e) => {
                e.preventDefault();
                if (!newUserData.usuario || !newUserData.clave || !newUserData.nombre) return;

                const newUser = {
                    id: Date.now(),
                    nombre: newUserData.nombre,
                    usuario: newUserData.usuario.toLowerCase().trim(),
                    clave: newUserData.clave,
                    rol: newUserData.rol
                };

                setUsuarios([...usuarios, newUser]);
                setNewUserData({ nombre: '', usuario: '', clave: '', rol: 'colaborador' });
                alert('¡Usuario creado con éxito!');
            };

            const handleChangePassword = (userId) => {
                if (!newPasswordValue.trim()) return;
                const updatedUsers = usuarios.map(u => {
                    if (u.id === userId) {
                        return { ...u, clave: newPasswordValue.trim() };
                    }
                    return u;
                });
                setUsuarios(updatedUsers);
                setEditingPasswordUserId(null);
                setNewPasswordValue('');
                alert('¡Contraseña actualizada correctamente!');
            };

            const gradosMap = {
                1: "Evangelizada", 2: "Contactada", 3: "Interesada", 4: "Dispuesta",
                5: "Invitada", 6: "Congregante", 7: "Miembro", 8: "Servidor"
            };

            const filteredPersonas = personas.filter(p => {
                const matchName = p.nombre.toLowerCase().includes(searchTerm.toLowerCase()) || p.perfil.toLowerCase().includes(searchTerm.toLowerCase());
                const matchGrado = filterGrado === 'todos' || p.grado.toString() === filterGrado;
                return matchName && matchGrado;
            });

            // PANTALLA DE LOGIN (Sin datos expuestos)
            if (!currentUser) {
                return (
                    <div className="min-h-screen bg-gray-100 flex flex-col justify-center items-center p-4">
                        <div className="max-w-md w-full bg-white rounded-2xl shadow-xl border border-gray-200 p-8 space-y-6">
                            <div className="text-center space-y-3">
                                <img src="Logo La Casa del Alfarero.png" alt="Logo" className="h-20 mx-auto object-contain" onError={(e)=>{e.target.style.display='none';}} />
                                <h1 className="text-2xl font-bold text-gray-900">La Casa del Alfarero</h1>
                                <p className="text-xs font-semibold text-brandRed uppercase tracking-wider">Sistema de Seguimiento Pastoral</p>
                            </div>

                            <form onSubmit={handleLogin} className="space-y-4">
                                {loginError && (
                                    <div className="bg-red-50 text-red-700 text-xs p-3 rounded-lg border border-red-200 font-semibold">
                                        {loginError}
                                    </div>
                                )}
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Usuario</label>
                                    <input 
                                        type="text" 
                                        required
                                        placeholder="Ingrese su usuario"
                                        value={loginUserInput}
                                        onChange={(e) => setLoginUserInput(e.target.value)}
                                        className="w-full px-4 py-2.5 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brandRed"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Contraseña</label>
                                    <input 
                                        type="password" 
                                        required
                                        placeholder="••••••••"
                                        value={loginPassInput}
                                        onChange={(e) => setLoginPassInput(e.target.value)}
                                        className="w-full px-4 py-2.5 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brandRed"
                                    />
                                </div>
                                <button type="submit" className="w-full bg-brandRed text-white font-bold py-3 rounded-lg hover:bg-red-700 transition shadow">
                                    Ingresar a la Plataforma
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col bg-gray-100 relative pb-20">
                    <header className="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-30">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-3">
                                <img src="Logo La Casa del Alfarero.png" alt="Logo" className="h-10 object-contain" onError={(e)=>{e.target.style.display='none';}} />
                                <div>
                                    <h1 className="text-base font-bold text-gray-900 leading-tight">La Casa del Alfarero</h1>
                                    <p className="text-xs text-gray-500 font-semibold">Seguimiento • {currentUser.nombre}</p>
                                </div>
                            </div>

                            <div className="flex items-center gap-3 flex-wrap justify-center">
                                <nav className="flex bg-gray-100 p-1 rounded-lg text-xs font-semibold">
                                    <button onClick={() => setActiveTab('dashboard')} className={`px-3 py-1.5 rounded-md transition ${activeTab === 'dashboard' ? 'bg-brandRed text-white shadow' : 'text-gray-600'}`}>Dashboard</button>
                                    <button onClick={() => setActiveTab('personas')} className={`px-3 py-1.5 rounded-md transition ${activeTab === 'personas' ? 'bg-brandRed text-white shadow' : 'text-gray-600'}`}>Personas</button>
                                    <button onClick={() => setActiveTab('oracion')} className={`px-3 py-1.5 rounded-md transition ${activeTab === 'oracion' ? 'bg-brandRed text-white shadow' : 'text-gray-600'}`}>Intercesión</button>
                                    {currentUser.rol === 'pastor' && (
                                        <button onClick={() => setActiveTab('usuarios')} className={`px-3 py-1.5 rounded-md transition ${activeTab === 'usuarios' ? 'bg-brandBlue text-white shadow' : 'text-gray-600'}`}>Usuarios Admin</button>
                                    )}
                                </nav>
                                <button onClick={handleLogout} className="text-xs text-gray-500 hover:text-red-600 font-semibold px-2 py-1">
                                    Cerrar Sesión ➔
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Botón Flotante Siempre Visible */}
                    <button 
                        onClick={() => setShowNewPersonModal(true)}
                        className="fixed bottom-6 right-6 bg-brandRed text-white font-bold px-5 py-3 rounded-full shadow-2xl hover:bg-red-700 transition flex items-center gap-2 z-40"
                    >
                        <span className="text-xl leading-none">+</span> Nueva Ficha
                    </button>

                    <main className="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-6">
                                <div className="bg-gradient-to-r from-brandBlue to-blue-900 rounded-2xl p-6 text-white shadow-md flex justify-between items-center">
                                    <div>
                                        <h2 className="text-2xl font-bold mb-1">Bienvenido, {currentUser.nombre}</h2>
                                        <p className="text-blue-100 text-xs">Registro y seguimiento consciente de las almas.</p>
                                    </div>
                                    <img src="Logo La Casa del Alfarero.png" alt="Logo" className="h-16 brightness-200 opacity-30 hidden sm:block" onError={(e)=>{e.target.style.display='none';}} />
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                    <div className="bg-white p-5 rounded-xl shadow-sm border"><p className="text-xs text-gray-500 font-semibold uppercase">Total Personas</p><p className="text-3xl font-extrabold text-brandRed mt-1">{personas.length}</p></div>
                                    <div className="bg-white p-5 rounded-xl shadow-sm border"><p className="text-xs text-gray-500 font-semibold uppercase">En Proceso (Grado 3-5)</p><p className="text-3xl font-extrabold text-brandBlue mt-1">{personas.filter(p => p.grado >= 3 && p.grado <= 5).length}</p></div>
                                    <div className="bg-white p-5 rounded-xl shadow-sm border"><p className="text-xs text-gray-500 font-semibold uppercase">Congregantes / Miembros</p><p className="text-3xl font-extrabold text-emerald-600 mt-1">{personas.filter(p => p.grado >= 6).length}</p></div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'personas' && (
                            <div className="space-y-6">
                                <div className="flex gap-3 bg-white p-4 rounded-xl shadow-sm border">
                                    <input 
                                        type="text" 
                                        placeholder="Buscar persona o perfil..." 
                                        value={searchTerm} 
                                        onChange={(e) => setSearchTerm(e.target.value)} 
                                        className="px-4 py-2 border rounded-lg text-sm w-full" 
                                    />
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {filteredPersonas.map(persona => (
                                        <div key={persona.id} className="bg-white rounded-xl shadow-sm border flex flex-col justify-between overflow-hidden">
                                            <div className="p-5 border-b">
                                                <div className="flex justify-between items-start mb-2">
                                                    <h3 className="text-lg font-bold text-gray-900">{persona.nombre}</h3>
                                                    <span className="bg-blue-50 text-brandBlue text-xs font-bold px-2.5 py-1 rounded-full border">{persona.gradoTexto}</span>
                                                </div>
                                                <p className="text-xs text-gray-500 mb-1">Canal: {persona.canal}</p>
                                                <p className="text-xs font-medium text-brandRed mb-3">Seguimiento a cargo de: {persona.colaborador || 'Sin asignar'}</p>
                                                <p className="text-sm text-gray-600 line-clamp-3">{persona.perfil}</p>
                                            </div>
                                            <div className="px-5 py-3 bg-gray-50 flex justify-between items-center">
                                                <span className="text-xs text-gray-500">{persona.pedidosOracion.length} pedidos</span>
                                                <button onClick={() => { setSelectedPerson(persona); setIsEditingPerson(false); }} className="text-xs bg-brandRed text-white font-semibold px-3 py-1.5 rounded-lg">Ver Ficha</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'oracion' && (
                            <div className="bg-white p-6 rounded-xl shadow-sm border space-y-4">
                                <h2 className="text-xl font-bold text-gray-900">Motivos de Oración Activos</h2>
                                {personas.map(persona => persona.pedidosOracion.length > 0 && (
                                    <div key={persona.id} className="border rounded-lg p-4 bg-gray-50">
                                        <div className="flex justify-between items-center mb-1">
                                            <h4 className="font-bold text-brandBlue">{persona.nombre}</h4>
                                            <span className="text-xs text-gray-500">Seguimiento: {persona.colaborador}</span>
                                        </div>
                                        <ul className="list-disc list-inside text-sm text-gray-700">
                                            {persona.pedidosOracion.map((p, idx) => (<li key={idx}><strong>{p.categoria}:</strong> {p.texto}</li>))}
                                        </ul>
                                    </div>
                                ))}
                            </div>
                        )}

                        {activeTab === 'usuarios' && currentUser.rol === 'pastor' && (
                            <div className="space-y-6">
                                <div className="bg-white p-6 rounded-xl shadow-sm border space-y-4">
                                    <h2 className="text-xl font-bold text-gray-900">Crear Nuevo Usuario / Hermano</h2>
                                    <form onSubmit={handleCreateUser} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 mb-1">Nombre Completo</label>
                                            <input type="text" required value={newUserData.nombre} onChange={e=>setNewUserData({...newUserData, nombre: e.target.value})} className="w-full p-2 border rounded text-sm" placeholder="Ej: Hermana Marta" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 mb-1">Nombre de Usuario (Login)</label>
                                            <input type="text" required value={newUserData.usuario} onChange={e=>setNewUserData({...newUserData, usuario: e.target.value})} className="w-full p-2 border rounded text-sm" placeholder="Ej: marta" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 mb-1">Contraseña</label>
                                            <input type="password" required value={newUserData.clave} onChange={e=>setNewUserData({...newUserData, clave: e.target.value})} className="w-full p-2 border rounded text-sm" placeholder="••••••••" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 mb-1">Rol</label>
                                            <select value={newUserData.rol} onChange={e=>setNewUserData({...newUserData, rol: e.target.value})} className="w-full p-2 border rounded text-sm">
                                                <option value="colaborador">Hermano Colaborador</option>
                                                <option value="pastor">Pastor / Administrador</option>
                                            </select>
                                        </div>
                                        <div className="md:col-span-2">
                                            <button type="submit" className="bg-brandBlue text-white font-bold px-4 py-2 rounded text-sm hover:bg-blue-900 transition">
                                                + Registrar Usuario
                                            </button>
                                        </div>
                                    </form>
                                </div>

                                <div className="bg-white p-6 rounded-xl shadow-sm border">
                                    <h3 className="text-lg font-bold text-gray-900 mb-4">Usuarios Habilitados</h3>
                                    <div className="divide-y">
                                        {usuarios.map(u => (
                                            <div key={u.id} className="py-3 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 text-sm">
                                                <div>
                                                    <p className="font-bold text-gray-800">{u.nombre}</p>
                                                    <p className="text-xs text-gray-500">Usuario: <span className="font-semibold text-gray-700">{u.usuario}</span> • Clave: <span className="font-mono bg-gray-100 px-2 py-0.5 rounded text-gray-600">••••••••</span></p>
                                                </div>
                                                <div className="flex items-center gap-2 w-full sm:w-auto">
                                                    <span className="bg-gray-100 text-gray-700 text-xs px-2.5 py-1 rounded-full font-bold uppercase">{u.rol}</span>
                                                    {editingPasswordUserId === u.id ? (
                                                        <div className="flex items-center gap-1">
                                                            <input 
                                                                type="text" 
                                                                placeholder="Nueva clave" 
                                                                value={newPasswordValue} 
                                                                onChange={e => setNewPasswordValue(e.target.value)}
                                                                className="p-1 border rounded text-xs w-28"
                                                            />
                                                            <button onClick={() => handleChangePassword(u.id)} className="bg-emerald-600 text-white px-2 py-1 rounded text-xs font-bold">Guardar</button>
                                                            <button onClick={() => setEditingPasswordUserId(null)} className="bg-gray-300 text-gray-700 px-2 py-1 rounded text-xs">✕</button>
                                                        </div>
                                                    ) : (
                                                        <button onClick={() => { setEditingPasswordUserId(u.id); setNewPasswordValue(''); }} className="text-xs bg-blue-50 text-brandBlue font-semibold px-2.5 py-1 rounded border border-blue-200">
                                                            Cambiar Clave
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* MODAL CREAR NUEVA FICHA */}
                    {showNewPersonModal && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-lg w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h3 className="text-lg font-bold text-gray-900">Crear Nueva Ficha de Persona</h3>
                                    <button onClick={() => setShowNewPersonModal(false)} className="text-gray-400 font-bold">✕</button>
                                </div>
                                <form onSubmit={handleCreatePerson} className="space-y-3">
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">Nombre Completo *</label>
                                        <input type="text" required value={newPersonData.nombre} onChange={e=>setNewPersonData({...newPersonData, nombre: e.target.value})} className="w-full p-2 border rounded text-sm" placeholder="Ej: María González" />
                                    </div>
                                    <div className="grid grid-cols-2 gap-3">
                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 mb-1">Grado Inicial</label>
                                            <select value={newPersonData.grado} onChange={e=>setNewPersonData({...newPersonData, grado: e.target.value})} className="w-full p-2 border rounded text-sm">
                                                {Object.entries(gradosMap).map(([num, name]) => (
                                                    <option key={num} value={num}>Grado {num}: {name}</option>
                                                ))}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 mb-1">Canal de Origen</label>
                                            <select value={newPersonData.canal} onChange={e=>setNewPersonData({...newPersonData, canal: e.target.value})} className="w-full p-2 border rounded text-sm">
                                                <option value="Evangelismo">Evangelismo</option>
                                                <option value="Allegado">Allegado</option>
                                                <option value="Google Maps">Google Maps</option>
                                                <option value="Traspaso">Traspaso</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">Perfil / Notas de Contexto</label>
                                        <textarea rows="3" value={newPersonData.perfil} onChange={e=>setNewPersonData({...newPersonData, perfil: e.target.value})} className="w-full p-2 border rounded text-sm" placeholder="Detalles de la persona..."></textarea>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">Petición de Oración</label>
                                        <input type="text" value={newPersonData.peticionesOracion} onChange={e=>setNewPersonData({...newPersonData, peticionesOracion: e.target.value})} className="w-full p-2 border rounded text-sm" placeholder="Ej: Salud" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">Notas para el Pastor</label>
                                        <textarea rows="2" value={newPersonData.notasPastor} onChange={e=>setNewPersonData({...newPersonData, notasPastor: e.target.value})} className="w-full p-2 border rounded text-sm" placeholder="Mensaje o reporte para el pastor..."></textarea>
                                    </div>
                                    <div className="flex justify-end gap-2 pt-3 border-t">
                                        <button type="button" onClick={() => setShowNewPersonModal(false)} className="px-4 py-2 border rounded text-xs font-semibold">Cancelar</button>
                                        <button type="submit" className="px-4 py-2 bg-brandRed text-white rounded text-xs font-bold hover:bg-red-700">Guardar Ficha</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL FICHA DETALLADA Y EDITABLE CON RESTRICCIONES DE PERMISOS */}
                    {selectedPerson && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-2xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
                                <div className="flex justify-between items-start border-b pb-3">
                                    <div>
                                        <h2 className="text-xl font-bold">{selectedPerson.nombre}</h2>
                                        <p className="text-xs text-brandBlue font-semibold">{selectedPerson.gradoTexto} • Canal: {selectedPerson.canal}</p>
                                        <p className="text-xs font-semibold text-brandRed mt-0.5">Seguimiento a cargo de: {selectedPerson.colaborador || 'Sin asignar'}</p>
                                    </div>
                                    <div className="flex items-center gap-2">
                                        {(currentUser.rol === 'pastor' || currentUser.nombre === selectedPerson.colaborador) && (
                                            <button onClick={() => setIsEditingPerson(!isEditingPerson)} className="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold px-3 py-1.5 rounded border">
                                                {isEditingPerson ? 'Cancelar Edición' : '✏️ Editar Ficha'}
                                            </button>
                                        )}
                                        <button onClick={() => { setSelectedPerson(null); setIsEditingPerson(false); }} className="font-bold text-lg px-2">✕</button>
                                    </div>
                                </div>

                                {!isEditingPerson ? (
                                    <div className="space-y-4 text-sm">
                                        <div>
                                            <h4 className="font-bold text-gray-700 mb-1">Perfil</h4>
                                            <p className="text-gray-600 bg-gray-50 p-3 rounded">{selectedPerson.perfil}</p>
                                        </div>

                                        <div>
                                            <h4 className="font-bold text-gray-700 mb-1">Pedidos de Oración</h4>
                                            {selectedPerson.pedidosOracion.map((p, i) => (
                                                <div key={i} className="text-xs bg-amber-50 p-2 rounded border mb-1">
                                                    <strong>{p.categoria}:</strong> {p.texto}
                                                </div>
                                            ))}
                                        </div>

                                        <div className="bg-gray-50 p-3 rounded border">
                                            <h4 className="font-bold text-gray-700 text-xs uppercase mb-1">Notas para el Pastor</h4>
                                            <p className="text-gray-700 text-xs">{selectedPerson.notasPastor || 'Sin notas registradas.'}</p>
                                        </div>

                                        <div className="bg-blue-50 p-3 rounded border border-blue-200">
                                            <h4 className="font-bold text-brandBlue text-xs uppercase mb-1">Comentarios del Pastor</h4>
                                            <p className="text-gray-700 text-xs">{selectedPerson.comentariosPastor || 'Sin comentarios pastorales.'}</p>
                                        </div>
                                    </div>
                                ) : (
                                    <form onSubmit={handleSaveEditedPerson} className="space-y-3 text-sm">
                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="block text-xs font-bold text-gray-700 mb-1">Grado Actual</label>
                                                <select 
                                                    value={selectedPerson.grado} 
                                                    onChange={e => setSelectedPerson({...selectedPerson, grado: parseInt(e.target.value)})}
                                                    className="w-full p-2 border rounded text-xs"
                                                >
                                                    {Object.entries(gradosMap).map(([num, name]) => (
                                                        <option key={num} value={num}>Grado {num}: {name}</option>
                                                    ))}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-gray-700 mb-1">Colaborador a Cargo</label>
                                                {currentUser.rol === 'pastor' ? (
                                                    <select 
                                                        value={selectedPerson.colaborador || ''} 
                                                        onChange={e => setSelectedPerson({...selectedPerson, colaborador: e.target.value})}
                                                        className="w-full p-2 border rounded text-xs bg-white"
                                                    >
                                                        <option value="">Seleccionar colaborador</option>
                                                        {usuarios.filter(u => u.rol === 'colaborador').map(u => (
                                                            <option key={u.id} value={u.nombre}>{u.nombre}</option>
                                                        ))}
                                                    </select>
                                                ) : (
                                                    <input type="text" disabled value={selectedPerson.colaborador} className="w-full p-2 border rounded text-xs bg-gray-100 text-gray-500" />
                                                )}
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 mb-1">Perfil / Notas</label>
                                            <textarea 
                                                rows="3" 
                                                value={selectedPerson.perfil} 
                                                onChange={e => setSelectedPerson({...selectedPerson, perfil: e.target.value})}
                                                className="w-full p-2 border rounded text-xs"
                                            ></textarea>
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 mb-1">Pedido de Oración Principal</label>
                                            <input 
                                                type="text" 
                                                value={selectedPerson.pedidosOracion[0] ? selectedPerson.pedidosOracion[0].texto : ''} 
                                                onChange={e => {
                                                    const newP = [...selectedPerson.pedidosOracion];
                                                    if(newP[0]) newP[0].texto = e.target.value;
                                                    else newP.push({ categoria: "General", texto: e.target.value });
                                                    setSelectedPerson({...selectedPerson, pedidosOracion: newP});
                                                }}
                                                className="w-full p-2 border rounded text-xs"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 mb-1">Notas para el Pastor</label>
                                            <textarea 
                                                rows="2" 
                                                value={selectedPerson.notasPastor || ''} 
                                                onChange={e => setSelectedPerson({...selectedPerson, notasPastor: e.target.value})}
                                                className="w-full p-2 border rounded text-xs"
                                            ></textarea>
                                        </div>

                                        {currentUser.rol === 'pastor' && (
                                            <div className="bg-blue-50 p-3 rounded border border-blue-200">
                                                <label className="block text-xs font-bold text-brandBlue uppercase mb-1">Comentarios del Pastor (Exclusivo Pastor)</label>
                                                <textarea 
                                                    rows="2" 
                                                    value={selectedPerson.comentariosPastor || ''} 
                                                    onChange={e => setSelectedPerson({...selectedPerson, comentariosPastor: e.target.value})}
                                                    className="w-full p-2 border rounded text-xs bg-white"
                                                ></textarea>
                                            </div>
                                        )}

                                        <div className="flex justify-end gap-2 pt-3 border-t">
                                            <button type="button" onClick={() => setIsEditingPerson(false)} className="px-3 py-1.5 border rounded text-xs">Cancelar</button>
                                            <button type="submit" className="px-4 py-1.5 bg-brandRed text-white rounded text-xs font-bold hover:bg-red-700">Guardar Cambios</button>
                                        </div>
                                    </form>
                                )}

                                <div className="flex justify-end pt-2 border-t">
                                    <button onClick={() => { setSelectedPerson(null); setIsEditingPerson(false); }} className="bg-gray-800 text-white px-4 py-2 rounded text-xs font-semibold">Cerrar Ficha</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
