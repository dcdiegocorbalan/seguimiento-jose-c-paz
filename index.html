<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Seguimiento | La Casa del Alfarero</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandRed: '#C8102E',
                        brandBlue: '#2E4A78',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased font-sans">
    <div id="root"></div>

    <script type="text/babel">
        // ==========================================
        // CONFIGURACIÓN DE FIREBASE
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCpy8H7bwtRPumLGmmDaTdouxrEPu9MPSY",
            authDomain: "seguimiento-jose-c-paz.firebaseapp.com",
            projectId: "seguimiento-jose-c-paz",
            storageBucket: "seguimiento-jose-c-paz.firebasestorage.app",
            messagingSenderId: "217508939664",
            appId: "1:217508939664:web:0bc4ad5fbf8d46267c1515"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // DICCIONARIOS
        const gradosMap = {
            1: "Evangelizada", 2: "Contactada", 3: "Interesada", 4: "Dispuesta",
            5: "Invitada", 6: "Congregante", 7: "Miembro", 8: "Servidor"
        };

        const gradosDesc = {
            1: "Ha escuchado el mensaje del evangelio y recibido la semilla de la palabra de salvación.",
            2: "Se ha establecido un primer contacto directo de seguimiento, bienvenida o saludo inicial.",
            3: "Muestra curiosidad genuina, apertura y receptividad hacia las cosas de Dios y la iglesia.",
            4: "Manifiesta buena disposición y apertura para dar pasos firmes en su fe y crecimiento espiritual.",
            5: "Asiste de manera activa a las reuniones generales, cultos o eventos especiales de la congregación.",
            6: "Participa regularmente de los servicios y busca integrarse de lleno a la comunidad de fe.",
            7: "Ha asumido un compromiso formal, sentido de pertenencia e identidad con la iglesia local.",
            8: "Colabora activamente en los distintos ministerios, áreas y obras de servicio dentro de la iglesia."
        };

        const canalesDesc = {
            "Evangelismo": "La persona llega a la iglesia mediante una invitación directa de los evangelismos, ya sea por cuenta propia mediante los volantes o mediante el seguimiento.",
            "Allegado": "La persona llega a la iglesia por invitación de un hermano de la iglesia o del compañerismo. Hay un vínculo familiar, amistoso o cercano que abre la posibilidad de invitarlo.",
            "Redes Sociales": "La persona conoce y visita la iglesia por sus redes sociales.",
            "Google Maps": "La persona busca congregarse en una iglesia y llega al compañerismo porque busca previamente en su zona y aparece entre las opciones.",
            "Traspaso": "La persona es un congregante de otra iglesia y por razones particulares busca otro lugar en la que seguir congregando."
        };

        function App() {
            const [usuarios, setUsuarios] = React.useState([]);
            const [personas, setPersonas] = React.useState([]);
            const [solicitudesClave, setSolicitudesClave] = React.useState([]);
            const [oracionesPersonales, setOracionesPersonales] = React.useState([]);
            const [cargandoDatos, setCargandoDatos] = React.useState(true);

            // Estado para el modal flotante de información
            const [infoModal, setInfoModal] = React.useState(null);

            // Estado para el panel desplegable de notificaciones
            const [showNotificationsPanel, setShowNotificationsPanel] = React.useState(false);

            // Estado de Archivar
            const [showArchiveModal, setShowArchiveModal] = React.useState(false);
            const [archiveMotivo, setArchiveMotivo] = React.useState('Nuevo miembro');
            const [archiveObs, setArchiveObs] = React.useState('');
            const [personToArchive, setPersonToArchive] = React.useState(null);

            // Estado de Sesión en el navegador actual
            const [currentUser, setCurrentUser] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('alfarero_current_user');
                    return saved ? JSON.parse(saved) : null;
                } catch (e) {
                    return null;
                }
            });

            // IDs de notificaciones leídas por usuario
            const [readNotificationIds, setReadNotificationIds] = React.useState(() => {
                try {
                    const saved = localStorage.getItem('alfarero_read_notifs');
                    return saved ? JSON.parse(saved) : {};
                } catch (e) {
                    return {};
                }
            });

            // Formularios de Login y Recuperación
            const [loginUserInput, setLoginUserInput] = React.useState('');
            const [loginPassInput, setLoginPassInput] = React.useState('');
            const [loginError, setLoginError] = React.useState('');
            const [showForgotModal, setShowForgotModal] = React.useState(false);
            const [forgotUserInput, setForgotUserInput] = React.useState('');
            const [forgotSuccessMsg, setForgotSuccessMsg] = React.useState('');

            // Estado para cambio de clave obligatorio
            const [nuevaClaveObligatoria, setNuevaClaveObligatoria] = React.useState('');
            const [confirmarClaveObligatoria, setConfirmarClaveObligatoria] = React.useState('');
            const [errorCambioClave, setErrorCambioClave] = React.useState('');

            // Navegación y Vistas
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [selectedPerson, setSelectedPerson] = React.useState(null);
            const [isEditingPerson, setIsEditingPerson] = React.useState(false);
            const [searchTerm, setSearchTerm] = React.useState('');
            const [filterGrado, setFilterGrado] = React.useState('todos');
            const [filterCanal, setFilterCanal] = React.useState('todos');

            // Modales
            const [showNewPersonModal, setShowNewPersonModal] = React.useState(false);

            // Formularios
            const [newPersonData, setNewPersonData] = React.useState({
                nombre: '',
                genero: 'femenino',
                grado: 3,
                canal: 'Evangelismo',
                colaborador: '',
                telefono: '',
                direccion: '',
                perfil: '',
                temasOracion: '',
                notasPastor: '',
                notasColaborador: '',
                notasPrivadasPastor: ''
            });

            const [newUserData, setNewUserData] = React.useState({
                nombre: '',
                usuario: '',
                clave: '',
                rol: 'colaborador'
            });

            // Formulario para nueva Oración Privada estructurada con ítems dinámicos
            const [categoriaOracion, setCategoriaOracion] = React.useState('Personales');
            const [nuevaCategoriaInput, setNuevaCategoriaInput] = React.useState('');
            const [itemsOracion, setItemsOracion] = React.useState([
                { motivo: '', detalle: '' }
            ]);

            const [filtroCategoriaOracion, setFiltroCategoriaOracion] = React.useState('todas');

            // Estado para nuevo evento en el historial de la ficha seleccionada
            const [nuevoHistorial, setNuevoHistorial] = React.useState({
                tipo: 'Llamada',
                fecha: new Date().toISOString().split('T')[0],
                detalle: ''
            });

            const [editingPasswordUserId, setEditingPasswordUserId] = React.useState(null);
            const [newPasswordValue, setNewPasswordValue] = React.useState('');

            // Sincronización con Firestore
            React.useEffect(() => {
                const unsubUsuarios = db.collection('usuarios').onSnapshot(snapshot => {
                    const lista = snapshot.docs.map(doc => ({ idDoc: doc.id, ...doc.data() }));
                    if (lista.length === 0) {
                        const iniciales = [
                            { id: 1, usuario: "pastor", clave: "1234", nombre: "Pastor / Administración", rol: "pastor", debeCambiarClave: false },
                            { id: 2, usuario: "tatiana", clave: "1234", nombre: "Tatiana Cariddi", rol: "colaborador", debeCambiarClave: false }
                        ];
                        iniciales.forEach(u => db.collection('usuarios').add(u));
                    } else {
                        setUsuarios(lista);
                    }
                }, err => console.error("Error usuarios:", err));

                const unsubPersonas = db.collection('personas').onSnapshot(snapshot => {
                    const lista = snapshot.docs.map(doc => ({ idDoc: doc.id, ...doc.data() }));
                    setPersonas(lista);
                    
                    setSelectedPerson(prev => {
                        if (!prev) return null;
                        const actualizada = lista.find(p => p.idDoc === prev.idDoc || p.id === prev.id);
                        return actualizada ? actualizada : prev;
                    });
                }, err => console.error("Error personas:", err));

                const unsubSolicitudes = db.collection('solicitudesClave').onSnapshot(snapshot => {
                    const lista = snapshot.docs.map(doc => ({ idDoc: doc.id, ...doc.data() }));
                    setSolicitudesClave(lista);
                }, err => console.error("Error solicitudes:", err));

                const unsubOracionesPers = db.collection('oracionesPersonales').onSnapshot(snapshot => {
                    const lista = snapshot.docs.map(doc => ({ idDoc: doc.id, ...doc.data() }));
                    setOracionesPersonales(lista);
                    setCargandoDatos(false);
                }, error => {
                    console.error("Error cargando oraciones:", error);
                    setCargandoDatos(false);
                });

                return () => {
                    unsubUsuarios();
                    unsubPersonas();
                    unsubSolicitudes();
                    unsubOracionesPers();
                };
            }, []);

            // Control del botón Atrás (historial del navegador móvil)
            React.useEffect(() => {
                const handlePopState = () => {
                    if (showNotificationsPanel) {
                        setShowNotificationsPanel(false);
                    } else if (infoModal) {
                        setInfoModal(null);
                    } else if (showArchiveModal) {
                        setShowArchiveModal(false);
                    } else if (showNewPersonModal) {
                        setShowNewPersonModal(false);
                    } else if (selectedPerson) {
                        setSelectedPerson(null);
                        setIsEditingPerson(false);
                    } else if (activeTab !== 'dashboard') {
                        setActiveTab('dashboard');
                    }
                };

                window.addEventListener('popstate', handlePopState);
                return () => window.removeEventListener('popstate', handlePopState);
            }, [showNotificationsPanel, infoModal, showArchiveModal, showNewPersonModal, selectedPerson, activeTab]);

            React.useEffect(() => {
                if (currentUser) {
                    localStorage.setItem('alfarero_current_user', JSON.stringify(currentUser));
                } else {
                    localStorage.removeItem('alfarero_current_user');
                }
            }, [currentUser]);

            React.useEffect(() => {
                try {
                    localStorage.setItem('alfarero_read_notifs', JSON.stringify(readNotificationIds));
                } catch (e) {}
            }, [readNotificationIds]);

            // Usuarios únicos sin duplicados (por usuario o nombre normalizado)
            const usuariosUnicos = React.useMemo(() => {
                const map = new Map();
                usuarios.forEach(u => {
                    if (!u) return;
                    const key = (u.usuario || u.nombre || '').toString().trim().toLowerCase();
                    if (!key) return;
                    if (!map.has(key)) {
                        map.set(key, u);
                    }
                });
                return Array.from(map.values());
            }, [usuarios]);

            const colaboradoresUnicos = React.useMemo(() => {
                return Array.from(new Set(usuariosUnicos.map(u => u.nombre).filter(Boolean)));
            }, [usuariosUnicos]);

            // Construcción de notificaciones por usuario con distinción de Importantes y Leídas/No Leídas
            const notificacionesUsuario = React.useMemo(() => {
                if (!currentUser) return [];

                const lista = [];
                const isPastor = currentUser.rol === 'pastor';
                const myNameLower = (currentUser.nombre || '').trim().toLowerCase();
                const myUserLower = (currentUser.usuario || '').trim().toLowerCase();

                const matchesCurrentUser = (value) => {
                    if (!value) return false;
                    const v = value.toString().trim().toLowerCase();
                    return v === myNameLower || v === myUserLower;
                };

                personas.forEach(p => {
                    if (!p) return;
                    const assignedToMe = matchesCurrentUser(p.colaborador);
                    const pKey = p.idDoc || p.id || p.nombre;

                    // 1. Historial / Interacciones
                    if (Array.isArray(p.historial)) {
                        p.historial.forEach((h, idx) => {
                            if (!h) return;
                            const autorRol = (h.autorRol || '').toString().toLowerCase();
                            const autorEsPastor = autorRol === 'pastor' || matchesCurrentUser(h.autor) && isPastor;
                            const autorEsMio = matchesCurrentUser(h.autor);

                            let incluir = false;
                            let esImportante = false;
                            let etiquetaImportante = '';

                            if (isPastor) {
                                if (!autorEsMio) {
                                    incluir = true;
                                    if (h.tipo === 'Comentario' || h.tipo === 'Nota') {
                                        esImportante = true;
                                        etiquetaImportante = 'Comentario de colaborador';
                                    }
                                }
                            } else {
                                if (assignedToMe && !autorEsMio) {
                                    incluir = true;
                                    if (autorEsPastor || (h.autor && h.autor.toLowerCase().includes('pastor'))) {
                                        esImportante = true;
                                        etiquetaImportante = 'Interacción del pastor en tu ficha';
                                    }
                                }
                            }

                            if (incluir) {
                                const notifId = `hist_${pKey}_${h.id || idx}`;
                                lista.push({
                                    id: notifId,
                                    timestamp: Number(h.id) || idx,
                                    fecha: h.fecha || '',
                                    personaIdDoc: p.idDoc,
                                    personaNombre: p.nombre,
                                    autor: h.autor || 'Usuario',
                                    tipo: h.tipo || 'Actualización',
                                    mensaje: h.detalle || 'Actualización en ficha',
                                    esImportante,
                                    etiquetaImportante
                                });
                            }
                        });
                    }

                    // 2. Comentario / Nota del pastor para el colaborador (Importante para el colaborador asignado)
                    if (!isPastor && assignedToMe && p.notasPastor && p.notasPastor.trim() !== '') {
                        const notifId = `nota_pastor_${pKey}_${encodeURIComponent(p.notasPastor.trim().slice(0, 40))}`;
                        lista.push({
                            id: notifId,
                            timestamp: Number(p.id) || 1,
                            fecha: 'Nota Pastoral',
                            personaIdDoc: p.idDoc,
                            personaNombre: p.nombre,
                            autor: 'Pastor',
                            tipo: 'Comentario del Pastor',
                            mensaje: p.notasPastor.trim(),
                            esImportante: true,
                            etiquetaImportante: 'Comentario del pastor para ti'
                        });
                    }

                    // 3. Comentario / Nota del colaborador para el pastor (Importante para el pastor)
                    if (isPastor && p.notasColaborador && p.notasColaborador.trim() !== '' && !matchesCurrentUser(p.colaborador)) {
                        const notifId = `nota_colab_${pKey}_${encodeURIComponent(p.notasColaborador.trim().slice(0, 40))}`;
                        lista.push({
                            id: notifId,
                            timestamp: Number(p.id) || 1,
                            fecha: 'Nota Colaborador',
                            personaIdDoc: p.idDoc,
                            personaNombre: p.nombre,
                            autor: p.colaborador || 'Colaborador',
                            tipo: 'Comentario de Colaborador',
                            mensaje: p.notasColaborador.trim(),
                            esImportante: true,
                            etiquetaImportante: 'Comentario del colaborador para el pastor'
                        });
                    }
                });

                lista.sort((a, b) => b.timestamp - a.timestamp);
                return lista;
            }, [personas, currentUser]);

            const userReadSet = React.useMemo(() => {
                if (!currentUser) return new Set();
                const key = (currentUser.usuario || currentUser.nombre || '').toString().toLowerCase();
                return new Set(readNotificationIds[key] || []);
            }, [currentUser, readNotificationIds]);

            const unreadNotificationsCount = React.useMemo(() => {
                return notificacionesUsuario.filter(n => !userReadSet.has(n.id)).length;
            }, [notificacionesUsuario, userReadSet]);

            const markNotificationAsRead = (notifId) => {
                if (!currentUser) return;
                const key = (currentUser.usuario || currentUser.nombre || '').toString().toLowerCase();
                setReadNotificationIds(prev => {
                    const existing = new Set(prev[key] || []);
                    existing.add(notifId);
                    return {
                        ...prev,
                        [key]: Array.from(existing)
                    };
                });
            };

            const markAllNotificationsAsRead = () => {
                if (!currentUser) return;
                const key = (currentUser.usuario || currentUser.nombre || '').toString().toLowerCase();
                setReadNotificationIds(prev => ({
                    ...prev,
                    [key]: notificacionesUsuario.map(n => n.id)
                }));
            };

            const handleOpenNotification = (notif) => {
                markNotificationAsRead(notif.id);
                setShowNotificationsPanel(false);
                const persFound = personas.find(p => p.idDoc === notif.personaIdDoc || p.nombre === notif.personaNombre);
                if (persFound) {
                    setSelectedPerson(persFound);
                    setIsEditingPerson(false);
                }
            };

            const handleLogin = (e) => {
                e.preventDefault();
                const userFound = usuariosUnicos.find(
                    u => u.usuario.toLowerCase() === loginUserInput.trim().toLowerCase() && u.clave === loginPassInput.trim()
                );
                if (userFound) {
                    setCurrentUser(userFound);
                    setActiveTab('dashboard');
                    setLoginError('');
                    setLoginUserInput('');
                    setLoginPassInput('');
                } else {
                    setLoginError('Usuario o contraseña incorrectos.');
                }
            };

            const handleLogout = () => {
                setCurrentUser(null);
                setShowNotificationsPanel(false);
                setActiveTab('dashboard');
            };

            const handleRequestPasswordReset = (e) => {
                e.preventDefault();
                if (!forgotUserInput.trim()) return;

                const userExists = usuariosUnicos.find(u => u.usuario.toLowerCase() === forgotUserInput.trim().toLowerCase());
                if (!userExists) {
                    setForgotSuccessMsg('Si el usuario existe, se ha enviado la solicitud al administrador.');
                    return;
                }

                const yaExiste = solicitudesClave.some(s => s.usuario.toLowerCase() === forgotUserInput.trim().toLowerCase() && !s.atendida);
                if (!yaExiste) {
                    const nuevaSolicitud = {
                        id: Date.now(),
                        usuario: userExists.usuario,
                        nombre: userExists.nombre,
                        fecha: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString(),
                        atendida: false
                    };
                    db.collection('solicitudesClave').add(nuevaSolicitud);
                }

                setForgotSuccessMsg('¡Solicitud enviada con éxito! El administrador revisará tu pedido.');
                setTimeout(() => {
                    setShowForgotModal(false);
                    setForgotSuccessMsg('');
                    setForgotUserInput('');
                }, 3000);
            };

            const handleSaveMandatoryPassword = async (e) => {
                e.preventDefault();
                if (!nuevaClaveObligatoria || nuevaClaveObligatoria.length < 4) {
                    setErrorCambioClave('La contraseña debe tener al menos 4 caracteres.');
                    return;
                }
                if (nuevaClaveObligatoria !== confirmarClaveObligatoria) {
                    setErrorCambioClave('Las contraseñas no coinciden.');
                    return;
                }

                const userDoc = usuarios.find(u => u.usuario === currentUser.usuario);
                if (userDoc && userDoc.idDoc) {
                    await db.collection('usuarios').doc(userDoc.idDoc).update({
                        clave: nuevaClaveObligatoria,
                        debeCambiarClave: false
                    });
                }

                const updatedCurrent = { ...currentUser, clave: nuevaClaveObligatoria, debeCambiarClave: false };
                setCurrentUser(updatedCurrent);
                setNuevaClaveObligatoria('');
                setConfirmarClaveObligatoria('');
                setErrorCambioClave('');
                alert('¡Contraseña actualizada correctamente!');
            };

            const handleResolveResetRequest = async (solicitudIdDoc, usuarioLogin, nuevaClaveTemp) => {
                if (!nuevaClaveTemp) {
                    alert('Por favor ingrese una contraseña temporal.');
                    return;
                }

                const targetUser = usuarios.find(u => u.usuario.toLowerCase() === usuarioLogin.toLowerCase());
                if (targetUser && targetUser.idDoc) {
                    await db.collection('usuarios').doc(targetUser.idDoc).update({
                        clave: nuevaClaveTemp,
                        debeCambiarClave: true
                    });
                }

                await db.collection('solicitudesClave').doc(solicitudIdDoc).update({ atendida: true });
                alert(`Contraseña restablecida para ${usuarioLogin}. Deberá cambiarla al iniciar sesión.`);
            };

            const handleCreatePerson = async (e) => {
                e.preventDefault();
                if (!newPersonData.nombre.trim()) return;

                const grNum = parseInt(newPersonData.grado);
                let colabAsignado = newPersonData.colaborador;
                if (!colabAsignado) {
                    colabAsignado = currentUser.nombre;
                }

                const newEntry = {
                    id: Date.now(),
                    nombre: newPersonData.nombre,
                    genero: newPersonData.genero,
                    grado: grNum,
                    gradoTexto: gradosMap[grNum],
                    canal: newPersonData.canal,
                    colaborador: colabAsignado,
                    telefono: newPersonData.telefono || '',
                    direccion: newPersonData.direccion || '',
                    perfil: newPersonData.perfil || 'Sin datos de perfil.',
                    temasOracion: newPersonData.temasOracion || '',
                    notasPastor: newPersonData.notasPastor || '',
                    notasColaborador: newPersonData.notasColaborador || '',
                    notasPrivadasPastor: currentUser.rol === 'pastor' ? (newPersonData.notasPrivadasPastor || '') : '',
                    historial: [
                        {
                            id: Date.now(),
                            tipo: 'Creación',
                            fecha: new Date().toISOString().split('T')[0],
                            detalle: `Ficha creada por ${currentUser.nombre}`,
                            autor: currentUser.nombre,
                            autorRol: currentUser.rol
                        }
                    ],
                    archivado: false,
                    motivoArchivo: null,
                    observacionesArchivo: null
                };

                await db.collection('personas').add(newEntry);
                setShowNewPersonModal(false);
                setNewPersonData({
                    nombre: '', genero: 'femenino', grado: 3, canal: 'Evangelismo', colaborador: '',
                    telefono: '', direccion: '', perfil: '', temasOracion: '', notasPastor: '', notasColaborador: '', notasPrivadasPastor: ''
                });
            };

            const handleSaveEditedPerson = async (e) => {
                e.preventDefault();
                if (selectedPerson && selectedPerson.idDoc) {
                    const grNum = parseInt(selectedPerson.grado);
                    
                    const editItem = {
                        id: Date.now(),
                        tipo: 'Actualización',
                        fecha: new Date().toISOString().split('T')[0],
                        detalle: `Ficha actualizada por ${currentUser.nombre}`,
                        autor: currentUser.nombre,
                        autorRol: currentUser.rol
                    };
                    const histActualizado = [editItem, ...(Array.isArray(selectedPerson.historial) ? selectedPerson.historial : [])];

                    const dataToUpdate = {
                        ...selectedPerson,
                        grado: grNum,
                        gradoTexto: gradosMap[grNum],
                        historial: histActualizado
                    };
                    delete dataToUpdate.idDoc;
                    await db.collection('personas').doc(selectedPerson.idDoc).update(dataToUpdate);
                }
                setIsEditingPerson(false);
                alert('¡Ficha actualizada con éxito!');
            };

            // Funciones para manejar los ítems dinámicos de la carga de oración
            const handleAddItemOracion = () => {
                setItemsOracion([...itemsOracion, { motivo: '', detalle: '' }]);
            };

            const handleRemoveItemOracion = (index) => {
                const lista = [...itemsOracion];
                lista.splice(index, 1);
                setItemsOracion(lista);
            };

            const handleItemOracionChange = (index, field, value) => {
                const lista = [...itemsOracion];
                lista[index][field] = value;
                setItemsOracion(lista);
            };

            const handleSaveOracionPersonal = async (e) => {
                e.preventDefault();
                const itemsValidos = itemsOracion.filter(item => item.motivo && item.motivo.trim() !== '');
                if (itemsValidos.length === 0) {

                                                    value={nuevoHistorial.detalle} 
                                                    onChange={e => setNuevoHistorial({...nuevoHistorial, detalle: e.target.value})}
                                                    className="w-full p-1.5 border rounded text-xs"
                                                />
                                            </form>

                                            {/* Listado de interacciones */}
                                            <div className="space-y-2 max-h-48 overflow-y-auto">
                                                {(!selectedPerson.historial || selectedPerson.historial.length === 0) ? (
                                                    <p className="text-xs text-gray-500 italic py-2 text-center">No hay interacciones registradas aún.</p>
                                                ) : (
                                                    selectedPerson.historial.map(item => (
                                                        <div key={item.id} className="bg-white p-2.5 rounded border text-xs flex justify-between items-start">
                                                            <div>
                                                                <div className="flex items-center gap-2 font-bold text-gray-800">
                                                                    <span className="bg-blue-100 text-brandBlue px-2 py-0.5 rounded text-[10px]">{item.tipo}</span>
                                                                    <span>{item.fecha}</span>
                                                                    <span className="text-gray-400 font-normal">({item.autor})</span>
                                                                </div>
                                                                <p className="text-gray-600 mt-1">{item.detalle}</p>
                                                            </div>
                                                            <button onClick={() => handleDeleteHistorialItem(item.id)} className="text-gray-400 hover:text-red-600 font-bold px-1">✕</button>
                                                        </div>
                                                    ))
                                                )}
                                            </div>
                                        </div>

                                        {selectedPerson.direccion && (
                                            <div className="bg-blue-50 p-3 rounded border border-blue-200 flex justify-between items-center">
                                                <div>
                                                    <span className="font-bold text-brandBlue text-xs uppercase block">Dirección</span>
                                                    <p className="text-gray-700 text-xs">{selectedPerson.direccion}</p>
                                                </div>
                                                <a 
                                                    href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(selectedPerson.direccion)}`} 
                                                    target="_blank" 
                                                    rel="noopener noreferrer" 
                                                    className="bg-brandBlue text-white text-xs font-bold px-3 py-2 rounded-lg hover:bg-blue-900 transition flex items-center gap-1 shadow"
                                                >
                                                    🗺️ Cómo llegar
                                                </a>
                                            </div>
                                        )}

                                        <div>
                                            <h4 className="font-bold text-gray-700 mb-1">Perfil</h4>
                                            <p className="text-gray-600 bg-gray-50 p-3 rounded">{selectedPerson.perfil}</p>
                                        </div>

                                        {/* NOTAS CRUZADAS: COLABORADOR Y PASTOR */}
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <div className="bg-gray-50 p-3 rounded border">
                                                <h4 className="font-bold text-gray-700 text-xs uppercase mb-1">Nota del Colaborador</h4>
                                                <p className="text-gray-700 text-xs">{selectedPerson.notasColaborador || 'Sin notas del colaborador.'}</p>
                                            </div>
                                            <div className="bg-red-50 p-3 rounded border border-red-200">
                                                <h4 className="font-bold text-brandRed text-xs uppercase mb-1">Nota para el Colaborador / Observaciones</h4>
                                                <p className="text-gray-700 text-xs">{selectedPerson.notasPastor || 'Sin notas pastorales.'}</p>
                                            </div>
                                        </div>

                                        <div className="flex justify-between items-center pt-3 border-t">
                                            <button 
                                                onClick={() => { setPersonToArchive(selectedPerson); setShowArchiveModal(true); }}
                                                className="text-xs bg-amber-100 text-amber-800 font-bold px-3 py-2 rounded-lg hover:bg-amber-200 transition"
                                            >
                                                📁 Dejar de seguir / Archivar
                                            </button>
                                            <button 
                                                onClick={() => handleDeletePerson(selectedPerson.idDoc)}
                                                className="text-xs bg-red-50 text-red-700 font-bold px-3 py-2 rounded-lg hover:bg-red-100 transition border border-red-200"
                                            >
                                                🗑️ Eliminar Ficha
                                            </button>
                                        </div>
                                    </div>
                                ) : (
                                    <form onSubmit={handleSaveEditedPerson} className="space-y-3 text-sm">
                                        {/* CAMPO EXCLUSIVO DE EDICIÓN DEL PASTOR */}
                                        {currentUser.rol === 'pastor' && (
                                            <div className="bg-purple-50 p-3 rounded-xl border-2 border-purple-300 space-y-1">
                                                <label className="block text-xs font-bold text-purple-900">
                                                    🔒 Comentarios Privados del Pastor (Solo visible en sesión Pastoral)
                                                </label>
                                                <textarea 
                                                    rows="3" 
                                                    value={selectedPerson.notasPrivadasPastor || ''} 
                                                    onChange={e => setSelectedPerson({...selectedPerson, notasPrivadasPastor: e.target.value})}
                                                    className="w-full p-2 border border-purple-300 rounded text-xs bg-white"
                                                    placeholder="Escribe aquí los temas confidenciales tratados en privado con esta persona..."
                                                ></textarea>
                                            </div>
                                        )}

                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="block text-xs font-bold text-gray-700 mb-1">Nivel Actual</label>
                                                <select 
                                                    value={selectedPerson.grado} 
                                                    onChange={e => setSelectedPerson({...selectedPerson, grado: parseInt(e.target.value)})}
                                                    className="w-full p-2 border rounded text-xs"
                                                >
                                                    {Object.entries(gradosMap).map(([num, name]) => (
                                                        <option key={num} value={num}>{name}</option>
                                                    ))}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-gray-700 mb-1 flex items-center justify-between">
                                                    <span>Canal de Invitación</span>
                                                    <span 
                                                        onClick={() => setInfoModal({ title: "Canales de Invitación", text: "Modifica el canal por el cual llegó la persona." })} 
                                                        className="text-brandBlue cursor-pointer text-[11px]"
                                                    >
                                                        ℹ️ Info
                                                    </span>
                                                </label>
                                                <select 
                                                    value={selectedPerson.canal} 
                                                    onChange={e => setSelectedPerson({...selectedPerson, canal: e.target.value})}
                                                    className="w-full p-2 border rounded text-xs bg-white"
                                                >
                                                    {Object.keys(canalesDesc).map(cName => (
                                                        <option key={cName} value={cName}>{cName}</option>
                                                    ))}
                                                </select>
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-3">
                                            <div>
                                                <label className="block text-xs font-bold text-gray-700 mb-1">Teléfono / WhatsApp</label>
                                                <input 
                                                    type="text" 
                                                    value={selectedPerson.telefono || ''} 
                                                    onChange={e => setSelectedPerson({...selectedPerson, telefono: e.target.value})}
                                                    className="w-full p-2 border rounded text-xs"
                                                />
                                            </div>
                                            <div>
                                                <label className="block text-xs font-bold text-gray-700 mb-1">Colaborador / Pastor a Cargo</label>
                                                <select 
                                                    value={selectedPerson.colaborador || ''} 
                                                    onChange={e => setSelectedPerson({...selectedPerson, colaborador: e.target.value})}
                                                    className="w-full p-2 border rounded text-xs bg-white font-semibold text-brandBlue"
                                                >
                                                    <option value="">Seleccionar encargado</option>
                                                    {colaboradoresUnicos.map(nombreColab => (
                                                        <option key={nombreColab} value={nombreColab}>{nombreColab}</option>
                                                    ))}
                                                </select>
                                            </div>
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-amber-900 mb-1">🙏 Temas de Oración</label>
                                            <input 
                                                type="text" 
                                                value={selectedPerson.temasOracion || ''} 
                                                onChange={e => setSelectedPerson({...selectedPerson, temasOracion: e.target.value})}
                                                className="w-full p-2 border rounded text-xs border-amber-300 bg-amber-50"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 mb-1">Dirección</label>
                                            <input 
                                                type="text" 
                                                value={selectedPerson.direccion || ''} 
                                                onChange={e => setSelectedPerson({...selectedPerson, direccion: e.target.value})}
                                                className="w-full p-2 border rounded text-xs"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 mb-1">Perfil / Notas</label>
                                            <textarea 
                                                rows="2" 
                                                value={selectedPerson.perfil} 
                                                onChange={e => setSelectedPerson({...selectedPerson, perfil: e.target.value})}
                                                className="w-full p-2 border rounded text-xs"
                                            ></textarea>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                            <div>
                                                <label className="block text-xs font-bold text-gray-700 mb-1">Nota del Colaborador</label>
                                                <input 
                                                    type="text" 
                                                    value={selectedPerson.notasColaborador || ''} 
                                                    onChange={e => setSelectedPerson({...selectedPerson, notasColaborador: e.target.value})}
                                                    className="w-full p-2 border rounded text-xs"
                                                />
                                            </div>
                                            {currentUser.rol === 'pastor' && (
                                                <div>
                                                    <label className="block text-xs font-bold text-brandRed mb-1">Nota para el Colaborador / Observaciones</label>
                                                    <input 
                                                        type="text" 
                                                        value={selectedPerson.notasPastor || ''} 
                                                        onChange={e => setSelectedPerson({...selectedPerson, notasPastor: e.target.value})}
                                                        className="w-full p-2 border rounded text-xs"
                                                    />
                                                </div>
                                            )}
                                        </div>

                                        <div className="flex justify-end gap-2 pt-3 border-t">
                                            <button type="button" onClick={() => setIsEditingPerson(false)} className="px-3 py-1.5 border rounded text-xs">Cancelar</button>
                                            <button type="submit" className="px-4 py-1.5 bg-brandRed text-white rounded text-xs font-bold hover:bg-red-700">Guardar Cambios</button>
                                        </div>
                                    </form>
                                )}

                                <div className="flex justify-end pt-2 border-t">
                                    <button onClick={() => { setSelectedPerson(null); setIsEditingPerson(false); }} className="bg-gray-800 text-white px-4 py-2 rounded text-xs font-semibold">Cerrar Ficha</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL DE ARCHIVAR CON MOTIVOS */}
                    {showArchiveModal && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                                <h3 className="font-bold text-gray-900 text-base border-b pb-2">📁 Archivar Seguimiento</h3>
                                <p className="text-xs text-gray-600">Selecciona el motivo por el cual se deja de dar seguimiento a esta persona:</p>
                                
                                <div className="space-y-2">
                                    {[
                                        "Nuevo miembro",
                                        "Eligió otra congregación",
                                        "No muestra interés ni contesta",
                                        "Dijo expresamente que no quiere congregarse ni que le escribamos",
                                        "Otros motivos"
                                    ].map(motivo => (
                                        <label key={motivo} className="flex items-center gap-2 text-xs font-medium text-gray-800 cursor-pointer p-2 rounded hover:bg-gray-50 border">
                                            <input 
                                                type="radio" 
                                                name="archiveMotivo" 
                                                value={motivo} 
                                                checked={archiveMotivo === motivo}
                                                onChange={e => setArchiveMotivo(e.target.value)}
                                            />
                                            {motivo}
                                        </label>
                                    ))}
                                </div>

                                <div>
                                    <label className="block text-xs font-bold text-gray-700 mb-1">Observaciones (Opcional)</label>
                                    <textarea 
                                        rows="2" 
                                        value={archiveObs} 
                                        onChange={e => setArchiveObs(e.target.value)} 
                                        className="w-full p-2 border rounded text-xs" 
                                        placeholder="Detalles adicionales..."
                                    ></textarea>
                                </div>

                                <div className="flex justify-end gap-2 pt-3 border-t">
                                    <button onClick={() => setShowArchiveModal(false)} className="px-3 py-1.5 border rounded text-xs">Cancelar</button>
                                    <button onClick={handleConfirmArchive} className="px-4 py-1.5 bg-amber-600 text-white rounded text-xs font-bold hover:bg-amber-700">Confirmar Archivo</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL FLOTANTE GENERAL DE INFORMACIÓN (ℹ️) */}
                    {infoModal && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-2xl border border-gray-100">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h3 className="font-bold text-gray-900 text-base flex items-center gap-2">
                                        ℹ️ {infoModal.title}
                                    </h3>
                                    <button onClick={() => setInfoModal(null)} className="text-gray-400 font-bold hover:text-gray-700 text-lg">✕</button>
                                </div>
                                <p className="text-sm text-gray-600 leading-relaxed">
                                    {infoModal.text}
                                </p>
                                <div className="flex justify-end pt-2">
                                    <button 
                                        onClick={() => setInfoModal(null)} 
                                        className="bg-brandBlue text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-blue-900 transition shadow"
                                    >
                                        Entendido
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
