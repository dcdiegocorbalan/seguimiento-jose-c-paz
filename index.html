<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Seguimiento | La Casa del Alfarero</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandRed: '#C8102E',
                        brandBlue: '#2E4A78',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 antialiased font-sans">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            // Base de datos de Usuarios
            const [usuarios, setUsuarios] = React.useState(() => {
                const saved = localStorage.getItem('alfarero_usuarios');
                if (saved) return JSON.parse(saved);
                return [
                    { id: 1, usuario: "pastor", clave: "1234", nombre: "Pastor / Administración", rol: "pastor" },
                    { id: 2, usuario: "colaborador", clave: "1234", nombre: "Hermano de Seguimiento", rol: "colaborador" }
                ];
            });

            // Estado de Sesión
            const [currentUser, setCurrentUser] = React.useState(() => {
                const saved = localStorage.getItem('alfarero_current_user');
                return saved ? JSON.parse(saved) : null;
            });

            // Formulario de Login
            const [loginUserInput, setLoginUserInput] = React.useState('');
            const [loginPassInput, setLoginPassInput] = React.useState('');
            const [loginError, setLoginError] = React.useState('');

            // Navegación y Vistas
            const [activeTab, setActiveTab] = React.useState('dashboard');
            const [selectedPerson, setSelectedPerson] = React.useState(null);
            const [searchTerm, setSearchTerm] = React.useState('');
            const [filterGrado, setFilterGrado] = React.useState('todos');

            // Modales
            const [showNewPersonModal, setShowNewPersonModal] = React.useState(false);

            // Formularios para nuevas entidades
            const [newPersonData, setNewPersonData] = React.useState({
                nombre: '',
                grado: 3,
                canal: 'Evangelismo',
                perfil: '',
                peticionesOracion: '',
                comentariosPastor: ''
            });

            const [newUserData, setNewUserData] = React.useState({
                nombre: '',
                usuario: '',
                clave: '',
                rol: 'colaborador'
            });

            // Base de datos de Personas
            const [personas, setPersonas] = React.useState(() => {
                const saved = localStorage.getItem('alfarero_personas');
                if (saved) return JSON.parse(saved);
                return [
                    {
                        id: 1,
                        nombre: "Stella",
                        grado: 6,
                        gradoTexto: "Grado 6: Congregante",
                        canal: "Visita",
                        visitas: 1,
                        perfil: "Sensible, estudiosa, busca superarse profesionalmente, muy amable, necesita mucha contención y compañía.",
                        pedidosOracion: [
                            { categoria: "Salud", texto: "Presión alta, diabetes." },
                            { categoria: "Estudios", texto: "Enfermería. Aprobar materias difíciles como inglés." }
                        ],
                        comentariosPastor: "No presenta un problema de salud grave.",
                        historial: [
                            { fecha: "Mediodía del 11/10/26", tipo: "Conversación de WhatsApp", nota: "Contacto positivo." }
                        ]
                    },
                    {
                        id: 2,
                        nombre: "Judith",
                        grado: 5,
                        gradoTexto: "Grado 5: Invitada",
                        canal: "Visita",
                        visitas: 0,
                        perfil: "Amable, proactiva, atareada. Doble ánimo, indecisa con congregarse. Amiga cercana de Stella.",
                        pedidosOracion: [{ categoria: "Salud", texto: "Tratamiento de diabetes." }],
                        comentariosPastor: "No presenta un problema de salud grave.",
                        historial: []
                    },
                    {
                        id: 3,
                        nombre: "Aldana",
                        grado: 5,
                        gradoTexto: "Grado 5: Visitante",
                        canal: "Evangelismo",
                        visitas: 0,
                        perfil: "Sensible, muy creativa, divertida, alegre. Volvió a congregarse en la iglesia.",
                        pedidosOracion: [{ categoria: "Trabajo", texto: "Mejor oportunidad laboral." }],
                        comentariosPastor: "No presenta un problema de salud grave.",
                        historial: []
                    }
                ];
            });

            // Guardar en localStorage
            React.useEffect(() => {
                localStorage.setItem('alfarero_personas', JSON.stringify(personas));
            }, [personas]);

            React.useEffect(() => {
                localStorage.setItem('alfarero_usuarios', JSON.stringify(usuarios));
            }, [usuarios]);

            React.useEffect(() => {
                if (currentUser) {
                    localStorage.setItem('alfarero_current_user', JSON.stringify(currentUser));
                } else {
                    localStorage.removeItem('alfarero_current_user');
                }
            }, [currentUser]);

            // Handler Login
            const handleLogin = (e) => {
                e.preventDefault();
                const userFound = usuarios.find(
                    u => u.usuario.toLowerCase() === loginUserInput.trim().toLowerCase() && u.clave === loginPassInput.trim()
                );

                if (userFound) {
                    setCurrentUser(userFound);
                    setLoginError('');
                    setLoginUserInput('');
                    setLoginPassInput('');
                } else {
                    setLoginError('Usuario o contraseña incorrectos.');
                }
            };

            const handleLogout = () => {
                setCurrentUser(null);
                setActiveTab('dashboard');
            };

            // Handler Crear Persona
            const handleCreatePerson = (e) => {
                e.preventDefault();
                if (!newPersonData.nombre.trim()) return;

                const newEntry = {
                    id: Date.now(),
                    nombre: newPersonData.nombre,
                    grado: parseInt(newPersonData.grado),
                    gradoTexto: `Grado ${newPersonData.grado}: ${gradosMap[newPersonData.grado]}`,
                    canal: newPersonData.canal,
                    visitas: 0,
                    perfil: newPersonData.perfil || 'Sin datos de perfil.',
                    pedidosOracion: newPersonData.peticionesOracion 
                        ? [{ categoria: "General", texto: newPersonData.peticionesOracion }] 
                        : [],
                    comentariosPastor: newPersonData.comentariosPastor || 'Sin observaciones.',
                    historial: []
                };

                setPersonas([newEntry, ...personas]);
                setShowNewPersonModal(false);
                setNewPersonData({ nombre: '', grado: 3, canal: 'Evangelismo', perfil: '', peticionesOracion: '', comentariosPastor: '' });
            };

            // Handler Crear Usuario
            const handleCreateUser = (e) => {
                e.preventDefault();
                if (!newUserData.usuario || !newUserData.clave || !newUserData.nombre) return;

                const newUser = {
                    id: Date.now(),
                    nombre: newUserData.nombre,
                    usuario: newUserData.usuario.toLowerCase().trim(),
                    clave: newUserData.clave,
                    rol: newUserData.rol
                };

                setUsuarios([...usuarios, newUser]);
                setNewUserData({ nombre: '', usuario: '', clave: '', rol: 'colaborador' });
                alert('¡Usuario creado con éxito!');
            };

            const gradosMap = {
                1: "Evangelizada", 2: "Contactada", 3: "Interesada", 4: "Dispuesta",
                5: "Invitada", 6: "Congregante", 7: "Miembro", 8: "Servidor"
            };

            const filteredPersonas = personas.filter(p => {
                const matchName = p.nombre.toLowerCase().includes(searchTerm.toLowerCase()) || p.perfil.toLowerCase().includes(searchTerm.toLowerCase());
                const matchGrado = filterGrado === 'todos' || p.grado.toString() === filterGrado;
                return matchName && matchGrado;
            });

            // 1. PANTALLA DE LOGIN SI NO HAY SESIÓN INICIADA
            if (!currentUser) {
                return (
                    <div className="min-h-screen bg-gray-100 flex flex-col justify-center items-center p-4">
                        <div className="max-w-md w-full bg-white rounded-2xl shadow-xl border border-gray-200 p-8 space-y-6">
                            <div className="text-center space-y-3">
                                <img src="Logo La Casa del Alfarero.png" alt="Logo La Casa del Alfarero" className="h-20 mx-auto object-contain" onError={(e)=>{e.target.style.display='none';}} />
                                <h1 className="text-2xl font-bold text-gray-900">La Casa del Alfarero</h1>
                                <p className="text-xs font-semibold text-brandRed uppercase tracking-wider">Sistema de Seguimiento Pastoral</p>
                            </div>

                            <form onSubmit={handleLogin} className="space-y-4">
                                {loginError && (
                                    <div className="bg-red-50 text-red-700 text-xs p-3 rounded-lg border border-red-200 font-semibold">
                                        {loginError}
                                    </div>
                                )}
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Usuario</label>
                                    <input 
                                        type="text" 
                                        required
                                        placeholder="Ej: pastor o colaborador"
                                        value={loginUserInput}
                                        onChange={(e) => setLoginUserInput(e.target.value)}
                                        className="w-full px-4 py-2.5 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brandRed"
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Contraseña</label>
                                    <input 
                                        type="password" 
                                        required
                                        placeholder="••••••••"
                                        value={loginPassInput}
                                        onChange={(e) => setLoginPassInput(e.target.value)}
                                        className="w-full px-4 py-2.5 border rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-brandRed"
                                    />
                                </div>
                                <button type="submit" className="w-full bg-brandRed text-white font-bold py-3 rounded-lg hover:bg-red-700 transition shadow">
                                    Ingresar a la Plataforma
                                </button>
                            </form>

                            <div className="bg-gray-50 p-3 rounded-lg border text-xs text-gray-500 space-y-1">
                                <p className="font-bold text-gray-700">Cuentas de prueba:</p>
                                <p>• Admin: <span className="font-semibold text-gray-800">pastor</span> / clave: <span className="font-semibold text-gray-800">1234</span></p>
                                <p>• Colaborador: <span className="font-semibold text-gray-800">colaborador</span> / clave: <span className="font-semibold text-gray-800">1234</span></p>
                            </div>
                        </div>
                    </div>
                );
            }

            // 2. PANTALLA PRINCIPAL
            return (
                <div className="min-h-screen flex flex-col bg-gray-100 relative pb-20">
                    {/* Header */}
                    <header className="bg-white border-b border-gray-200 shadow-sm sticky top-0 z-30">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-4">
                            <div className="flex items-center gap-3">
                                <img src="Logo La Casa del Alfarero.png" alt="Logo" className="h-10 object-contain" onError={(e)=>{e.target.style.display='none';}} />
                                <div>
                                    <h1 className="text-base font-bold text-gray-900 leading-tight">La Casa del Alfarero</h1>
                                    <p className="text-xs text-gray-500 font-semibold">Seguimiento • {currentUser.nombre}</p>
                                </div>
                            </div>

                            <div className="flex items-center gap-3 flex-wrap justify-center">
                                <nav className="flex bg-gray-100 p-1 rounded-lg text-xs font-semibold">
                                    <button onClick={() => setActiveTab('dashboard')} className={`px-3 py-1.5 rounded-md transition ${activeTab === 'dashboard' ? 'bg-brandRed text-white shadow' : 'text-gray-600'}`}>Dashboard</button>
                                    <button onClick={() => setActiveTab('personas')} className={`px-3 py-1.5 rounded-md transition ${activeTab === 'personas' ? 'bg-brandRed text-white shadow' : 'text-gray-600'}`}>Personas</button>
                                    <button onClick={() => setActiveTab('oracion')} className={`px-3 py-1.5 rounded-md transition ${activeTab === 'oracion' ? 'bg-brandRed text-white shadow' : 'text-gray-600'}`}>Intercesión</button>
                                    {currentUser.rol === 'pastor' && (
                                        <button onClick={() => setActiveTab('usuarios')} className={`px-3 py-1.5 rounded-md transition ${activeTab === 'usuarios' ? 'bg-brandBlue text-white shadow' : 'text-gray-600'}`}>Usuarios Admin</button>
                                    )}
                                </nav>

                                <button onClick={handleLogout} className="text-xs text-gray-500 hover:text-red-600 font-semibold px-2 py-1">
                                    Cerrar Sesión ➔
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Botón Flotante Siempre Visible */}
                    <button 
                        onClick={() => setShowNewPersonModal(true)}
                        className="fixed bottom-6 right-6 bg-brandRed text-white font-bold px-5 py-3 rounded-full shadow-2xl hover:bg-red-700 transition flex items-center gap-2 z-40"
                    >
                        <span className="text-xl leading-none">+</span> Nueva Ficha
                    </button>

                    <main className="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
                        {/* TAB DASHBOARD */}
                        {activeTab === 'dashboard' && (
                            <div className="space-y-6">
                                <div className="bg-gradient-to-r from-brandBlue to-blue-900 rounded-2xl p-6 text-white shadow-md flex justify-between items-center">
                                    <div>
                                        <h2 className="text-2xl font-bold mb-1">Bienvenido, {currentUser.nombre}</h2>
                                        <p className="text-blue-100 text-xs">Registro y seguimiento consciente de las almas.</p>
                                    </div>
                                    <img src="Logo La Casa del Alfarero.png" alt="Logo" className="h-16 brightness-200 opacity-30 hidden sm:block" onError={(e)=>{e.target.style.display='none';}} />
                                </div>

                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                    <div className="bg-white p-5 rounded-xl shadow-sm border"><p className="text-xs text-gray-500 font-semibold uppercase">Total Personas</p><p className="text-3xl font-extrabold text-brandRed mt-1">{personas.length}</p></div>
                                    <div className="bg-white p-5 rounded-xl shadow-sm border"><p className="text-xs text-gray-500 font-semibold uppercase">En Proceso (Grado 3-5)</p><p className="text-3xl font-extrabold text-brandBlue mt-1">{personas.filter(p => p.grado >= 3 && p.grado <= 5).length}</p></div>
                                    <div className="bg-white p-5 rounded-xl shadow-sm border"><p className="text-xs text-gray-500 font-semibold uppercase">Congregantes / Miembros</p><p className="text-3xl font-extrabold text-emerald-600 mt-1">{personas.filter(p => p.grado >= 6).length}</p></div>
                                </div>
                            </div>
                        )}

                        {/* TAB PERSONAS */}
                        {activeTab === 'personas' && (
                            <div className="space-y-6">
                                <div className="flex gap-3 bg-white p-4 rounded-xl shadow-sm border">
                                    <input 
                                        type="text" 
                                        placeholder="Buscar persona o perfil..." 
                                        value={searchTerm} 
                                        onChange={(e) => setSearchTerm(e.target.value)} 
                                        className="px-4 py-2 border rounded-lg text-sm w-full" 
                                    />
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                    {filteredPersonas.map(persona => (
                                        <div key={persona.id} className="bg-white rounded-xl shadow-sm border flex flex-col justify-between overflow-hidden">
                                            <div className="p-5 border-b">
                                                <div className="flex justify-between items-start mb-2">
                                                    <h3 className="text-lg font-bold text-gray-900">{persona.nombre}</h3>
                                                    <span className="bg-blue-50 text-brandBlue text-xs font-bold px-2.5 py-1 rounded-full border">{persona.gradoTexto}</span>
                                                </div>
                                                <p className="text-xs text-gray-500 mb-3">Canal: {persona.canal}</p>
                                                <p className="text-sm text-gray-600 line-clamp-3">{persona.perfil}</p>
                                            </div>
                                            <div className="px-5 py-3 bg-gray-50 flex justify-between items-center">
                                                <span className="text-xs text-gray-500">{persona.pedidosOracion.length} pedidos</span>
                                                <button onClick={() => setSelectedPerson(persona)} className="text-xs bg-brandRed text-white font-semibold px-3 py-1.5 rounded-lg">Ver Ficha</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* TAB INTERCESIÓN */}
                        {activeTab === 'oracion' && (
                            <div className="bg-white p-6 rounded-xl shadow-sm border space-y-4">
                                <h2 className="text-xl font-bold text-gray-900">Motivos de Oración Activos</h2>
                                {personas.map(persona => persona.pedidosOracion.length > 0 && (
                                    <div key={persona.id} className="border rounded-lg p-4 bg-gray-50">
                                        <h4 className="font-bold text-brandBlue mb-1">{persona.nombre}</h4>
                                        <ul className="list-disc list-inside text-sm text-gray-700">
                                            {persona.pedidosOracion.map((p, idx) => (<li key={idx}><strong>{p.categoria}:</strong> {p.texto}</li>))}
                                        </ul>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* TAB USUARIOS (SOLO ADMINISTRADOR/PASTOR) */}
                        {activeTab === 'usuarios' && currentUser.rol === 'pastor' && (
                            <div className="space-y-6">
                                <div className="bg-white p-6 rounded-xl shadow-sm border space-y-4">
                                    <h2 className="text-xl font-bold text-gray-900">Crear Nuevo Usuario / Hermano</h2>
                                    <form onSubmit={handleCreateUser} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 mb-1">Nombre Completo</label>
                                            <input type="text" required value={newUserData.nombre} onChange={e=>setNewUserData({...newUserData, nombre: e.target.value})} className="w-full p-2 border rounded text-sm" placeholder="Ej: Hermano Juan" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 mb-1">Nombre de Usuario (para Login)</label>
                                            <input type="text" required value={newUserData.usuario} onChange={e=>setNewUserData({...newUserData, usuario: e.target.value})} className="w-full p-2 border rounded text-sm" placeholder="Ej: juan" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 mb-1">Contraseña</label>
                                            <input type="password" required value={newUserData.clave} onChange={e=>setNewUserData({...newUserData, clave: e.target.value})} className="w-full p-2 border rounded text-sm" placeholder="••••••••" />
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 mb-1">Rol</label>
                                            <select value={newUserData.rol} onChange={e=>setNewUserData({...newUserData, rol: e.target.value})} className="w-full p-2 border rounded text-sm">
                                                <option value="colaborador">Hermano Colaborador</option>
                                                <option value="pastor">Pastor / Administrador</option>
                                            </select>
                                        </div>
                                        <div className="md:col-span-2">
                                            <button type="submit" className="bg-brandBlue text-white font-bold px-4 py-2 rounded text-sm hover:bg-blue-900 transition">
                                                + Registrar Usuario
                                            </button>
                                        </div>
                                    </form>
                                </div>

                                <div className="bg-white p-6 rounded-xl shadow-sm border">
                                    <h3 className="text-lg font-bold text-gray-900 mb-4">Usuarios Habilitados</h3>
                                    <div className="divide-y">
                                        {usuarios.map(u => (
                                            <div key={u.id} className="py-3 flex justify-between items-center text-sm">
                                                <div>
                                                    <p className="font-bold text-gray-800">{u.nombre}</p>
                                                    <p className="text-xs text-gray-500">Usuario: {u.usuario}</p>
                                                </div>
                                                <span className="bg-gray-100 text-gray-700 text-xs px-3 py-1 rounded-full font-bold uppercase">{u.rol}</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* MODAL CREAR NUEVA
